apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - manifests/namespace-networkpolicy.yaml
  - manifests/agentgateway-kagent.yaml
  - manifests/kagent-agent.yaml

configMapGenerator:
  - name: kubernetes-mcp-work-values
    envs:
      - work-values.env

generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/part-of: kubernetes-mcp-fleet-poc

replacements:
  - source:
      kind: ConfigMap
      name: kubernetes-mcp-work-values
      fieldPath: data.HOST_NAMESPACE
    targets:
      - select:
          kind: Namespace
          name: HOST_NAMESPACE_REPLACE
        fieldPaths: [metadata.name]
      - select:
          kind: NetworkPolicy
        fieldPaths: [metadata.namespace]
      - select:
          kind: ConfigMap
          name: kubernetes-mcp-work-values
        fieldPaths: [metadata.namespace]
        options:
          create: true
      - select:
          kind: AgentgatewayBackend
          name: kubernetes-mcp-fleet
        fieldPaths: [spec.mcp.targets.0.static.host]
        options:
          delimiter: "."
          index: 1

  - source:
      kind: ConfigMap
      name: kubernetes-mcp-work-values
      fieldPath: data.KAGENT_NAMESPACE
    targets:
      - select:
          kind: RemoteMCPServer
        fieldPaths: [metadata.namespace]
      - select:
          kind: Agent
          name: kubernetes-mcp-fleet-agent
        fieldPaths:
          - metadata.namespace
          - spec.declarative.tools.0.mcpServer.namespace
  - source:
      kind: ConfigMap
      name: kubernetes-mcp-work-values
      fieldPath: data.AGENTGATEWAY_NAMESPACE
    targets:
      - select:
          kind: AgentgatewayBackend
        fieldPaths: [metadata.namespace]
      - select:
          kind: AgentgatewayPolicy
        fieldPaths: [metadata.namespace]
      - select:
          kind: HTTPRoute
        fieldPaths:
          - metadata.namespace
          - spec.parentRefs.0.namespace
          - spec.rules.0.backendRefs.0.namespace
      - select:
          kind: NetworkPolicy
          name: kubernetes-mcp-fleet-allow
        fieldPaths:
          - spec.ingress.0.from.0.namespaceSelector.matchLabels.[kubernetes.io/metadata.name]

  - source:
      kind: ConfigMap
      name: kubernetes-mcp-work-values
      fieldPath: data.AGENTGATEWAY_NAME
    targets:
      - select:
          kind: HTTPRoute
        fieldPaths: [spec.parentRefs.0.name]

  - source:
      kind: ConfigMap
      name: kubernetes-mcp-work-values
      fieldPath: data.MODEL_CONFIG
    targets:
      - select:
          kind: Agent
          name: kubernetes-mcp-fleet-agent
        fieldPaths: [spec.declarative.modelConfig]

  - source:
      kind: ConfigMap
      name: kubernetes-mcp-work-values
      fieldPath: data.AGENTGATEWAY_MCP_URL
    targets:
      - select:
          kind: RemoteMCPServer
          name: kubernetes-mcp-fleet-gateway
        fieldPaths: [spec.url]

  # TOOL_ALLOWLIST is the single source for the Agent and gateway policy.
  # The Helm deployment receives the same list through deploy.sh --set values.
  - source: &tool0
      kind: ConfigMap
      name: kubernetes-mcp-work-values
      fieldPath: data.TOOL_ALLOWLIST
      options: {delimiter: ",", index: 0}
    targets:
      - select: {kind: Agent, name: kubernetes-mcp-fleet-agent}
        fieldPaths: [spec.declarative.tools.0.mcpServer.toolNames.0]
      - select: {kind: AgentgatewayPolicy, name: kubernetes-mcp-fleet}
        fieldPaths: [spec.backend.mcp.authorization.policy.matchExpressions.0]
        options: {delimiter: '"', index: 1}
  - source:
      <<: *tool0
      options: {delimiter: ",", index: 1}
    targets:
      - select: {kind: Agent, name: kubernetes-mcp-fleet-agent}
        fieldPaths: [spec.declarative.tools.0.mcpServer.toolNames.1]
      - select: {kind: AgentgatewayPolicy, name: kubernetes-mcp-fleet}
        fieldPaths: [spec.backend.mcp.authorization.policy.matchExpressions.0]
        options: {delimiter: '"', index: 3}
  - source:
      <<: *tool0
      options: {delimiter: ",", index: 2}
    targets:
      - select: {kind: Agent, name: kubernetes-mcp-fleet-agent}
        fieldPaths: [spec.declarative.tools.0.mcpServer.toolNames.2]
      - select: {kind: AgentgatewayPolicy, name: kubernetes-mcp-fleet}
        fieldPaths: [spec.backend.mcp.authorization.policy.matchExpressions.0]
        options: {delimiter: '"', index: 5}
  - source:
      <<: *tool0
      options: {delimiter: ",", index: 3}
    targets:
      - select: {kind: Agent, name: kubernetes-mcp-fleet-agent}
        fieldPaths: [spec.declarative.tools.0.mcpServer.toolNames.3]
      - select: {kind: AgentgatewayPolicy, name: kubernetes-mcp-fleet}
        fieldPaths: [spec.backend.mcp.authorization.policy.matchExpressions.0]
        options: {delimiter: '"', index: 7}
  - source:
      <<: *tool0
      options: {delimiter: ",", index: 4}
    targets:
      - select: {kind: Agent, name: kubernetes-mcp-fleet-agent}
        fieldPaths: [spec.declarative.tools.0.mcpServer.toolNames.4]
      - select: {kind: AgentgatewayPolicy, name: kubernetes-mcp-fleet}
        fieldPaths: [spec.backend.mcp.authorization.policy.matchExpressions.0]
        options: {delimiter: '"', index: 9}
  - source:
      <<: *tool0
      options: {delimiter: ",", index: 5}
    targets:
      - select: {kind: Agent, name: kubernetes-mcp-fleet-agent}
        fieldPaths: [spec.declarative.tools.0.mcpServer.toolNames.5]
      - select: {kind: AgentgatewayPolicy, name: kubernetes-mcp-fleet}
        fieldPaths: [spec.backend.mcp.authorization.policy.matchExpressions.0]
        options: {delimiter: '"', index: 11}
  - source:
      <<: *tool0
      options: {delimiter: ",", index: 6}
    targets:
      - select: {kind: Agent, name: kubernetes-mcp-fleet-agent}
        fieldPaths: [spec.declarative.tools.0.mcpServer.toolNames.6]
      - select: {kind: AgentgatewayPolicy, name: kubernetes-mcp-fleet}
        fieldPaths: [spec.backend.mcp.authorization.policy.matchExpressions.0]
        options: {delimiter: '"', index: 13}
  - source:
      <<: *tool0
      options: {delimiter: ",", index: 7}
    targets:
      - select: {kind: Agent, name: kubernetes-mcp-fleet-agent}
        fieldPaths: [spec.declarative.tools.0.mcpServer.toolNames.7]
      - select: {kind: AgentgatewayPolicy, name: kubernetes-mcp-fleet}
        fieldPaths: [spec.backend.mcp.authorization.policy.matchExpressions.0]
        options: {delimiter: '"', index: 15}

  # TARGET_API_CIDRS supplies twelve fixed egress slots. Unused slots are
  # padded with 0.0.0.0/32 so Kustomize remains deterministic.
  - source: &cidr0
      kind: ConfigMap
      name: kubernetes-mcp-work-values
      fieldPath: data.TARGET_API_CIDRS
      options: {delimiter: ",", index: 0}
    targets:
      - select: &networkPolicy {kind: NetworkPolicy, name: kubernetes-mcp-fleet-allow}
        fieldPaths: [spec.egress.1.to.0.ipBlock.cidr]
  - source: {<<: *cidr0, options: {delimiter: ",", index: 1}}
    targets:
      - select: *networkPolicy
        fieldPaths: [spec.egress.1.to.1.ipBlock.cidr]
  - source: {<<: *cidr0, options: {delimiter: ",", index: 2}}
    targets:
      - select: *networkPolicy
        fieldPaths: [spec.egress.1.to.2.ipBlock.cidr]
  - source: {<<: *cidr0, options: {delimiter: ",", index: 3}}
    targets:
      - select: *networkPolicy
        fieldPaths: [spec.egress.1.to.3.ipBlock.cidr]
  - source: {<<: *cidr0, options: {delimiter: ",", index: 4}}
    targets:
      - select: *networkPolicy
        fieldPaths: [spec.egress.1.to.4.ipBlock.cidr]
  - source: {<<: *cidr0, options: {delimiter: ",", index: 5}}
    targets:
      - select: *networkPolicy
        fieldPaths: [spec.egress.1.to.5.ipBlock.cidr]
  - source: {<<: *cidr0, options: {delimiter: ",", index: 6}}
    targets:
      - select: *networkPolicy
        fieldPaths: [spec.egress.1.to.6.ipBlock.cidr]
  - source: {<<: *cidr0, options: {delimiter: ",", index: 7}}
    targets:
      - select: *networkPolicy
        fieldPaths: [spec.egress.1.to.7.ipBlock.cidr]
  - source: {<<: *cidr0, options: {delimiter: ",", index: 8}}
    targets:
      - select: *networkPolicy
        fieldPaths: [spec.egress.1.to.8.ipBlock.cidr]
  - source: {<<: *cidr0, options: {delimiter: ",", index: 9}}
    targets:
      - select: *networkPolicy
        fieldPaths: [spec.egress.1.to.9.ipBlock.cidr]
  - source: {<<: *cidr0, options: {delimiter: ",", index: 10}}
    targets:
      - select: *networkPolicy
        fieldPaths: [spec.egress.1.to.10.ipBlock.cidr]
  - source: {<<: *cidr0, options: {delimiter: ",", index: 11}}
    targets:
      - select: *networkPolicy
        fieldPaths: [spec.egress.1.to.11.ipBlock.cidr]
