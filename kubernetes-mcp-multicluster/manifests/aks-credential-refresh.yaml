apiVersion: v1
kind: Secret
metadata:
  name: kubernetes-mcp-fleet-kubeconfig
  namespace: "HOST_NAMESPACE_REPLACE"
  labels:
    app.kubernetes.io/part-of: kubernetes-mcp-fleet-poc
    kubernetes-mcp-fleet/credential: "true"
type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp-fleet-workload-identity
  namespace: "HOST_NAMESPACE_REPLACE"
  annotations:
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"
  labels:
    app.kubernetes.io/part-of: kubernetes-mcp-fleet-poc
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubernetes-mcp-credential-publisher
  namespace: "HOST_NAMESPACE_REPLACE"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["kubernetes-mcp-fleet-kubeconfig"]
    verbs: ["get", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["kubernetes-mcp-fleet"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubernetes-mcp-credential-publisher
  namespace: "HOST_NAMESPACE_REPLACE"
subjects:
  - kind: ServiceAccount
    name: aks-mcp
    namespace: aks-mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubernetes-mcp-credential-publisher
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kubernetes-mcp-credential-refresh
  namespace: aks-mcp
  labels:
    app.kubernetes.io/part-of: kubernetes-mcp-fleet-poc
spec:
  schedule: "0 5 * * *"
  concurrencyPolicy: Forbid
  suspend: true
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: kubernetes-mcp-fleet-poc
            azure.workload.identity/use: "true"
        spec:
          serviceAccountName: aks-mcp
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refresh
              image: "example.invalid/aks-kubeconfig-refresh:replace"
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "/opt/kubernetes-mcp-refresh/refresh-aks-kubeconfig.sh"]
              envFrom:
                - configMapRef:
                    name: kubernetes-mcp-credential-refresh-values
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: refresh-script
                  mountPath: /opt/kubernetes-mcp-refresh
                  readOnly: true
                - name: work
                  mountPath: /work
          volumes:
            - name: refresh-script
              configMap:
                name: kubernetes-mcp-credential-refresh-script
                defaultMode: 365
            - name: work
              emptyDir:
                sizeLimit: 128Mi
