apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: kubernetes-mcp-fleet
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/part-of: kubernetes-mcp-fleet-poc
spec:
  mcp:
    failureMode: FailClosed
    sessionRouting: Stateless
    targets:
      - name: kubernetes-mcp-fleet
        static:
          host: kubernetes-mcp-fleet.kubernetes-mcp-poc.svc.cluster.local
          port: 8080
          path: /mcp
          protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubernetes-mcp-fleet
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/part-of: kubernetes-mcp-fleet-poc
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ai-gateway
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp/kubernetes-mcp-fleet
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: kubernetes-mcp-fleet
          namespace: agentgateway-system
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: kubernetes-mcp-fleet
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/part-of: kubernetes-mcp-fleet-poc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kubernetes-mcp-fleet
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
            - >-
              mcp.tool.name in [
                "events_list",
                "namespaces_list",
                "pods_get",
                "pods_list",
                "pods_list_in_namespace",
                "pods_log",
                "resources_get",
                "resources_list"
              ]
  traffic:
    rateLimit:
      local:
        # One-shot Inspector calls include session setup as well as the tool
        # request, so the deterministic 20-call smoke needs headroom.
        - requests: 240
          unit: Minutes
          burst: 80
    timeouts:
      request: 60s
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: kubernetes-mcp-fleet-direct
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: kubernetes-mcp-fleet-poc
spec:
  description: Direct, private discovery proof for the read-only multi-cluster Kubernetes MCP.
  protocol: STREAMABLE_HTTP
  timeout: 30s
  url: http://kubernetes-mcp-fleet.kubernetes-mcp-poc.svc.cluster.local:8080/mcp
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: kubernetes-mcp-fleet-gateway
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: kubernetes-mcp-fleet-poc
spec:
  description: Read-only multi-cluster Kubernetes MCP routed through agentgateway.
  protocol: STREAMABLE_HTTP
  timeout: 30s
  url: http://ai-gateway.agentgateway-system.svc.cluster.local/mcp/kubernetes-mcp-fleet
