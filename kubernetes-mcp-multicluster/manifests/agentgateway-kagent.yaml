apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: kubernetes-mcp-fleet
  namespace: "AGENTGATEWAY_NAMESPACE_REPLACE"
  labels:
    app.kubernetes.io/part-of: kubernetes-mcp-fleet-poc
spec:
  mcp:
    failureMode: FailClosed
    sessionRouting: Stateless
    targets:
      - name: kubernetes-mcp-fleet
        static:
          host: "kubernetes-mcp-fleet.HOST_NAMESPACE_REPLACE.svc.cluster.local"
          port: 8080
          path: /mcp
          protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubernetes-mcp-fleet
  namespace: "AGENTGATEWAY_NAMESPACE_REPLACE"
  labels:
    app.kubernetes.io/part-of: kubernetes-mcp-fleet-poc
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: "AGENTGATEWAY_NAME_REPLACE"
      namespace: "AGENTGATEWAY_NAMESPACE_REPLACE"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp/kubernetes-mcp-fleet
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: kubernetes-mcp-fleet
          namespace: "AGENTGATEWAY_NAMESPACE_REPLACE"
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: kubernetes-mcp-fleet
  namespace: "AGENTGATEWAY_NAMESPACE_REPLACE"
  labels:
    app.kubernetes.io/part-of: kubernetes-mcp-fleet-poc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kubernetes-mcp-fleet
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
            - 'mcp.tool.name in ["TOOL_0_REPLACE","TOOL_1_REPLACE","TOOL_2_REPLACE","TOOL_3_REPLACE","TOOL_4_REPLACE","TOOL_5_REPLACE","TOOL_6_REPLACE","TOOL_7_REPLACE"]'
  traffic:
    rateLimit:
      local:
        - requests: 240
          unit: Minutes
          burst: 80
    timeouts:
      request: 60s
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: kubernetes-mcp-fleet-gateway
  namespace: "KAGENT_NAMESPACE_REPLACE"
  labels:
    app.kubernetes.io/part-of: kubernetes-mcp-fleet-poc
spec:
  description: Read-only multi-cluster Kubernetes MCP routed through agentgateway.
  protocol: STREAMABLE_HTTP
  timeout: 30s
  url: "http://AGENTGATEWAY_SERVICE_REPLACE.AGENTGATEWAY_NAMESPACE_REPLACE.svc.cluster.local/mcp/kubernetes-mcp-fleet"
