apiVersion: v1
kind: Namespace
metadata:
  name: "HOST_NAMESPACE_REPLACE"
  labels:
    app.kubernetes.io/part-of: kubernetes-mcp-fleet-poc
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: "HOST_NAMESPACE_REPLACE"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubernetes-mcp-fleet-allow
  namespace: "HOST_NAMESPACE_REPLACE"
spec:
  podSelector:
    matchLabels:
      kubernetes-mcp-fleet/access: server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "AGENTGATEWAY_NAMESPACE_REPLACE"
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock: {cidr: "TARGET_API_CIDR_0_REPLACE"}
        - ipBlock: {cidr: "TARGET_API_CIDR_1_REPLACE"}
        - ipBlock: {cidr: "TARGET_API_CIDR_2_REPLACE"}
        - ipBlock: {cidr: "TARGET_API_CIDR_3_REPLACE"}
        - ipBlock: {cidr: "TARGET_API_CIDR_4_REPLACE"}
        - ipBlock: {cidr: "TARGET_API_CIDR_5_REPLACE"}
        - ipBlock: {cidr: "TARGET_API_CIDR_6_REPLACE"}
        - ipBlock: {cidr: "TARGET_API_CIDR_7_REPLACE"}
        - ipBlock: {cidr: "TARGET_API_CIDR_8_REPLACE"}
        - ipBlock: {cidr: "TARGET_API_CIDR_9_REPLACE"}
        - ipBlock: {cidr: "TARGET_API_CIDR_10_REPLACE"}
        - ipBlock: {cidr: "TARGET_API_CIDR_11_REPLACE"}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # Workload Identity token exchange. Prefer a controlled egress proxy or
    # Azure Firewall CIDR; standard NetworkPolicy cannot express FQDN rules.
    - to:
        - ipBlock: {cidr: "AZURE_IDENTITY_EGRESS_CIDR_0_REPLACE"}
        - ipBlock: {cidr: "AZURE_IDENTITY_EGRESS_CIDR_1_REPLACE"}
        - ipBlock: {cidr: "AZURE_IDENTITY_EGRESS_CIDR_2_REPLACE"}
        - ipBlock: {cidr: "AZURE_IDENTITY_EGRESS_CIDR_3_REPLACE"}
      ports:
        - protocol: TCP
          port: 443
