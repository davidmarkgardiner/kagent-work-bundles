apiVersion: v1
kind: Namespace
metadata:
  name: kubernetes-mcp-poc
  labels:
    app.kubernetes.io/part-of: kubernetes-mcp-fleet-poc
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: kubernetes-mcp-poc
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubernetes-mcp-fleet-allow
  namespace: kubernetes-mcp-poc
spec:
  podSelector:
    matchLabels:
      kubernetes-mcp-fleet/access: server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kagent
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentgateway-system
        - podSelector:
            matchLabels:
              kubernetes-mcp-fleet/access: smoke-client
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Environment-neutral POC rule. Production overlays should constrain
    # destination CIDRs as well as these Kubernetes API ports.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
