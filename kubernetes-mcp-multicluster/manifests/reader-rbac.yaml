apiVersion: v1
kind: Namespace
metadata:
  name: kubernetes-mcp-reader
  labels:
    app.kubernetes.io/part-of: kubernetes-mcp-fleet-poc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp-reader
  namespace: kubernetes-mcp-reader
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernetes-mcp-fleet-reader
  labels:
    app.kubernetes.io/part-of: kubernetes-mcp-fleet-poc
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods", "pods/status", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp-fleet-reader
  labels:
    app.kubernetes.io/part-of: kubernetes-mcp-fleet-poc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernetes-mcp-fleet-reader
subjects:
  - kind: ServiceAccount
    name: kubernetes-mcp-reader
    namespace: kubernetes-mcp-reader
