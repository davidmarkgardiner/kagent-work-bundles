# Deterministic protocol fixture; this is not an LLM or a production model.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tls-model-fixture
  namespace: tls-proof
data:
  server.py: |
    import json
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            if not self.path.endswith('/chat/completions'):
                self.send_error(404); return
            length = int(self.headers.get('Content-Length', '0'))
            if length > 1000000:
                self.send_error(413); return
            data = json.loads(self.rfile.read(length))
            if data.get('stream'):
                self.send_error(400, 'fixture supports non-streaming calls only'); return
            response = {'id':'fixture-response','object':'chat.completion','created':1,'model':'lab-fixture',
                'choices':[{'index':0,'message':{'role':'assistant','content':'LAB_FIXTURE_OK'},'finish_reason':'stop'}],
                'usage':{'prompt_tokens':1,'completion_tokens':1,'total_tokens':2}}
            body = json.dumps(response).encode()
            self.send_response(200); self.send_header('Content-Type','application/json'); self.send_header('Content-Length',str(len(body))); self.end_headers(); self.wfile.write(body)
        def log_message(self, fmt, *args):
            print('fixture_request', self.command, self.path, flush=True)
    ThreadingHTTPServer(('0.0.0.0',8080),Handler).serve_forever()
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tls-model-fixture
  namespace: tls-proof
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tls-model-fixture
  namespace: tls-proof
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tls-model-fixture
  template:
    metadata:
      labels:
        app: tls-model-fixture
    spec:
      serviceAccountName: tls-model-fixture
      containers:
      - name: fixture
        image: python:3.12-slim
        command: ["python", "/app/server.py"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: code
          mountPath: /app
          readOnly: true
      volumes:
      - name: code
        configMap:
          name: tls-model-fixture
---
apiVersion: v1
kind: Service
metadata:
  name: tls-model-fixture
  namespace: tls-proof
spec:
  selector:
    app: tls-model-fixture
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: tls-model-fixture-strict
  namespace: tls-proof
spec:
  selector:
    matchLabels:
      app: tls-model-fixture
  mtls:
    mode: STRICT
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tls-model-fixture
  namespace: tls-proof
spec:
  parentRefs:
  - name: tls-lab-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1
    backendRefs:
    - name: tls-model-fixture
      port: 8080
