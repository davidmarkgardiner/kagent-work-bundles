apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tls-agent-canary
  namespace: kagent
spec:
  parentRefs:
  - name: tls-agent-gateway
    sectionName: https
  hostnames:
  - tls-agent-gateway.kagent.svc.cluster.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /agents/kagent/tls-lab-canary
    backendRefs:
    - name: kagent-controller
      port: 8083
