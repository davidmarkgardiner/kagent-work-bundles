# Integration canary only: proves KRO composes native kagent 1.x resources.
# Security gateway, model and tool authorization are separate acceptance tests.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: agent-security-lab-canary
spec:
  schema:
    apiVersion: v1alpha1
    group: lab.example
    kind: AgentSecurityCanary
    scope: Namespaced
    spec:
      systemPrompt: string | default="You are a read-only synthetic lab canary." maxLength=1000
  resources:
    - id: template
      template:
        apiVersion: api.kagent.dev/v1alpha3
        kind: AgentTemplate
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
        spec:
          description: Synthetic tool-free lab canary.
          modelConfig:
            name: default-model-config
          systemPrompt: ${schema.spec.systemPrompt}
    - id: agent
      template:
        apiVersion: api.kagent.dev/v1alpha3
        kind: Agent
        metadata:
          name: ${schema.metadata.name}
          namespace: ${schema.metadata.namespace}
        spec:
          harnessRef:
            name: kagent-default
          template:
            ref:
              name: ${template.metadata.name}
