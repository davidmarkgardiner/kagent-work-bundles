apiVersion: v1
kind: Namespace
metadata:
  name: tls-proof
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: tls-plain
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tls-server
  namespace: tls-proof
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tls-client
  namespace: tls-proof
---
apiVersion: v1
kind: Pod
metadata:
  name: tls-server
  namespace: tls-proof
  labels:
    app: tls-server
spec:
  serviceAccountName: tls-server
  containers:
  - name: server
    image: python:3.12-slim
    command: ["python", "-m", "http.server", "8080"]
    ports:
    - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: tls-server
  namespace: tls-proof
spec:
  selector:
    app: tls-server
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: tls-client
  namespace: tls-proof
  labels:
    app: tls-client
spec:
  serviceAccountName: tls-client
  containers:
  - name: client
    image: python:3.12-slim
    command: ["sleep", "36000"]
---
apiVersion: v1
kind: Pod
metadata:
  name: plaintext-client
  namespace: tls-plain
spec:
  containers:
  - name: client
    image: python:3.12-slim
    command: ["sleep", "36000"]
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: tls-server-strict
  namespace: tls-proof
spec:
  selector:
    matchLabels:
      app: tls-server
  mtls:
    mode: STRICT
