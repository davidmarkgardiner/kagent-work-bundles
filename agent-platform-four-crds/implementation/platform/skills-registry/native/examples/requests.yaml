  prompt: Synthetic documentation case only. A network-isolated AKS bootstrap reports
    OrasPullUnauthorizedVMExtensionError, exit 212, registry HTTP 401. Load both aks-known-issues
    and kb-aks-bootstrap. Read references/error-code-map.md from the former and references/oras-pull-unauthorized.md
    from the latter with load_skill_resource. Also read references/release-proof.txt
    from EACH skill and report both complete release proof values, plus the runbook
    demo evidence code. Explain proposed identity and registry-permission checks,
    distinguish ABAC from ordinary RBAC, cite the source URLs, and state that no Azure
    investigation or changes were performed.
  referenceFile: references/error-code-map.md
  knowledgeFile: references/oras-pull-unauthorized.md
  answerTerms:
  - OrasPullUnauthorizedVMExtensionError
  - '212'
  - AKS-KB-ORAS-212-R1
  - Container Registry Repository Reader
  - AcrPull
  citations:
  - https://learn.microsoft.com/en-us/troubleshoot/azure/azure-kubernetes/error-codes/vmextensionerror-oraspullunauthorized
