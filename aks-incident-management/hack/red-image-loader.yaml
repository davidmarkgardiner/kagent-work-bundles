# Local red-cluster development helper only. This pod has node-root-equivalent
# access. Apply it only for a one-shot image import and delete it immediately.
apiVersion: v1
kind: Pod
metadata:
  name: incident-management-image-loader
  namespace: agentic-triage-proof
  labels:
    app.kubernetes.io/part-of: aks-incident-management
    incident.management/purpose: one-shot-image-import
spec:
  restartPolicy: Never
  nodeName: homelab-control-plane
  containers:
    - name: loader
      image: busybox:1.36
      command: [sh, -c, sleep 3600]
      securityContext: {privileged: true}
      volumeMounts:
        - {name: containerd-socket, mountPath: /run/containerd/containerd.sock}
        - {name: ctr, mountPath: /usr/local/bin/ctr, readOnly: true}
  volumes:
    - name: containerd-socket
      hostPath: {path: /run/containerd/containerd.sock, type: Socket}
    - name: ctr
      hostPath: {path: /usr/local/bin/ctr, type: File}
