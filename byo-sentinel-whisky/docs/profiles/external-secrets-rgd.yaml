apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: external-secrets-sentinel
spec:
  schema:
    apiVersion: v1alpha1
    kind: ExternalSecretsSentinel
    spec:
      targetName: string | required=true
      suspended: boolean | default=true
  resources:
  - id: scannerAccount
    template:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: ${schema.metadata.name}
        namespace: ${schema.metadata.namespace}
      automountServiceAccountToken: false
  - id: readerRole
    template:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: ${schema.metadata.name}
        namespace: ${schema.metadata.namespace}
      rules:
      - apiGroups:
        - external-secrets.io
        resources:
        - externalsecrets
        resourceNames:
        - ${schema.spec.targetName}
        verbs:
        - get
  - id: readerBinding
    template:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: ${schema.metadata.name}
        namespace: ${schema.metadata.namespace}
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: ${readerRole.metadata.name}
      subjects:
      - kind: ServiceAccount
        name: ${scannerAccount.metadata.name}
        namespace: ${schema.metadata.namespace}
  - id: scannerSchedule
    template:
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: ${schema.metadata.name}
        namespace: ${schema.metadata.namespace}
        annotations:
          sentinel.kro.run/reader-binding: ${readerBinding.metadata.name}
      spec:
        schedule: "*/5 * * * *"
        timeZone: Etc/UTC
        suspend: ${schema.spec.suspended}
        concurrencyPolicy: Forbid
        startingDeadlineSeconds: 120
        successfulJobsHistoryLimit: 1
        failedJobsHistoryLimit: 2
        jobTemplate:
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 120
            template:
              spec:
                serviceAccountName: ${scannerAccount.metadata.name}
                automountServiceAccountToken: true
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 65532
                  seccompProfile:
                    type: RuntimeDefault
                volumes:
                - name: scratch
                  emptyDir:
                    sizeLimit: 1Mi
                containers:
                - name: scanner
                  image: "{{APPROVED_KUBECTL_IMAGE_DIGEST}}"
                  command:
                  - /bin/sh
                  - -c
                  args:
                  - |
                    set -eu
                    kubeconfig() {
                      cat <<'CONFIG'
                    apiVersion: v1
                    kind: Config
                    clusters:
                    - name: worker
                      cluster:
                        server: https://kubernetes.default.svc
                        certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                    users:
                    - name: scanner
                      user:
                        tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
                    contexts:
                    - name: scanner
                      context:
                        cluster: worker
                        user: scanner
                    current-context: scanner
                    CONFIG
                    }
                    errors=$(mktemp /tmp/sentinel-query.XXXXXX)
                    trap 'rm -f "$errors"' EXIT
                    if result=$(kubeconfig | kubectl --kubeconfig=/dev/stdin --request-timeout=10s -n "$POD_NAMESPACE" get -o 'jsonpath={.status.conditions[?(@.type=="Ready")].status}' -- externalsecrets.external-secrets.io "$TARGET_NAME" 2>"$errors"); then
                      case "$result" in
                        True) state=healthy; reason=secret_ready ;;
                        False) state=unhealthy; reason=secret_not_ready ;;
                        *) state=unknown; reason=ready_condition_unknown ;;
                      esac
                    else
                      state=unknown
                      case "$(cat "$errors")" in
                        *'(Forbidden)'*) reason=forbidden ;;
                        *'(NotFound)'*) reason=not_found ;;
                        *'context deadline exceeded'*|*'i/o timeout'*) reason=timeout ;;
                        *) reason=query_failed ;;
                      esac
                    fi
                    printf '{"profile":"external-secrets","state":"%s","reason":"%s"}\n' "$state" "$reason"
                  volumeMounts:
                  - name: scratch
                    mountPath: /tmp
                  env:
                  - name: TARGET_NAME
                    value: ${schema.spec.targetName}
                  - name: POD_NAMESPACE
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.namespace
                  securityContext:
                    allowPrivilegeEscalation: false
                    readOnlyRootFilesystem: true
                    capabilities:
                      drop:
                      - ALL
                  resources:
                    requests:
                      cpu: 10m
                      memory: 32Mi
                    limits:
                      cpu: 100m
                      memory: 128Mi
