# AKS only. atelet pulls actor and worker images itself, not through containerd.
atelet:
  imageCredentialProviderBinDir: /var/lib/kubelet/credential-provider
  imageCredentialProviderConfigYAML: |
    apiVersion: kubelet.config.k8s.io/v1
    kind: CredentialProviderConfig
    providers:
    - name: acr-credential-provider
      matchImages: ["*.azurecr.io"]
      defaultCacheDuration: 10m
      apiVersion: credentialprovider.kubelet.k8s.io/v1
      args: ["/etc/kubernetes/azure.json"]
      env:
      - name: GODEBUG
        value: tlsmlkem=0
