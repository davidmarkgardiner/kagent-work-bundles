# Values for platform/aks-mcp/chart. AKS-MCP v0.0.20 is stdio-only, so the
# HTTP deployment remains on the last verified compatibility line until an
# HTTP bridge or a newer supported remote transport is adopted.
image:
  repository: ghcr.io/azure/aks-mcp
  tag: v0.0.19
  pullPolicy: IfNotPresent

fullnameOverride: "aks-mcp-{{CLUSTER_ALIAS}}"
replicaCount: 3

app:
  transport: streamable-http
  accessLevel: readonly
  cache: false
  allowedHosts:
    - "aks-mcp-{{CLUSTER_ALIAS}}.aks-mcp.svc.cluster.local"
    - "ai-gateway.agentgateway-system.svc.cluster.local"

config:
  enabledComponents:
    - kubectl
  allowNamespaces:
    - "{{ALLOWED_NAMESPACE}}"

azure:
  tenantId: "{{AZURE_TENANT_ID}}"
  clientId: "{{AZURE_CLIENT_ID}}"

workloadIdentity:
  enabled: true

kubeconfig:
  enabled: true
  secretName: aks-mcp-fleet-kubeconfig
  key: "{{CLUSTER_ALIAS}}.config"
  optional: false
  expectedCurrentContext: "{{CLUSTER_ALIAS}}"

serviceAccount:
  create: true
  automount: false

rbac:
  create: false

service:
  appProtocol: agentgateway.dev/mcp

extraEnv:
  - name: KUBECONFIG
    value: /home/mcp/.kube/config

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Change to keda only after replacing both placeholders with a tested query
# endpoint and an in-flight request or request-rate query.
autoscaling:
  mode: disabled
  minReplicas: 3
  maxReplicas: 10
  keda:
    prometheus:
      serverAddress: "{{PROMETHEUS_QUERY_ENDPOINT}}"
      query: "{{AKS_MCP_LOAD_QUERY}}"

# Direct calls to the shard Service are denied. Only the authenticated
# Agent Gateway dataplane may reach port 8000.
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentgateway-system
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: ai-gateway
      ports:
        - protocol: TCP
          port: 8000
