# Pipeline: Alloy -> Vector -> Kafka -> Argo, plus the evaluation settings the
# ticket workflow reads. Copied verbatim from ../../config as a portable
# snapshot so this folder stands alone when copied to work. Source of truth is
# ../../config; re-sync if that changes.
#
# Apply order matters: the semaphore ConfigMap must exist before the
# WorkflowTemplate that references it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 04-workflow-concurrency.yaml
  - 05-triage-evaluation-settings.yaml
  - 02-vector.yaml
  - 01-alloy.yaml
  - 03-argo.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: alloy-vector-kafka-triage
    includeSelectors: false
    includeTemplates: true
