---
apiVersion: v1
kind: Pod
metadata:
  name: smoke-log-aks-istio-ingress
  namespace: aks-istio-ingress
  labels: {app.kubernetes.io/part-of: alloy-vector-kafka-triage, sre.platform.io/triage: "true", smoke.sre.platform.io/suite: all-namespaces}
spec:
  restartPolicy: Never
  securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
  automountServiceAccountToken: false
  containers:
    - name: emitter
      image: busybox:1.36
      command: [sh, -c]
      args: ['while true; do echo "ERROR out of memory: container OOM condition detected, heap exhausted ns=aks-istio-ingress token=smk0"; sleep 20; done']
      securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 50m, memory: 32Mi}}
---
