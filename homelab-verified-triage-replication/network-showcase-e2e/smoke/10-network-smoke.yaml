# Network-specific smoke signal. Unlike the plain corpus, this one is
# deliberately shaped as a CROSS-NAMESPACE / cluster-wide connectivity problem
# (DNS resolution failure + refused connection to a service in another
# namespace). That shape is what should make the primary triage agent decide to
# call the aks-network-flow-triage agent for Hubble/Cilium flow evidence beyond
# this namespace -- exactly the A2A hop we want to showcase.
#
# Non-destructive: the pod only echoes a log line and sleeps. No networking is
# actually broken. Hardened to the `restricted` Pod Security Standard; requests
# and limits set.
#
# Namespace `platform-test-app` is application-tier and already in the worker
# Alloy allow-list (../pipeline/01-alloy.yaml), so the log line is collected.
---
apiVersion: v1
kind: Pod
metadata:
  name: smoke-network-crossns-dns
  namespace: platform-test-app
  labels:
    app.kubernetes.io/name: smoke-network-crossns-dns
    app.kubernetes.io/part-of: alloy-vector-kafka-triage
    sre.platform.io/triage: "true"
    sre.platform.io/workload-identity: smoke-network-crossns-dns
    smoke.sre.platform.io/suite: network-showcase-e2e
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: emitter
      image: busybox:1.36
      command: [sh, -c]
      # Re-emit the error line on a loop. A single startup echo can be missed by
      # a tail-based log collector (Alloy) that discovers the pod after the line
      # was written, so loop it to guarantee collection.
      args:
        - |
          while true; do
            echo "ERROR network: failed to resolve payments.production.svc.cluster.local: lookup on 10.96.0.10:53 read udp i/o timeout; and dial tcp 10.0.4.12:5432 connect: connection refused reaching orders-db.data namespace -- cross-namespace dependency unreachable, suspected DNS or NetworkPolicy denial request_id=net-smoke-20260804"
            sleep 20
          done
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 50m, memory: 32Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
