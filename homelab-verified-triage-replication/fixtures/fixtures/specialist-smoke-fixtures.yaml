# A deterministic, non-destructive signal set for the AKS specialist path.
# The five Event objects are synthetic Warning Events associated with the Pods
# below. They exercise collection, classification and routing without trying
# to exhaust a node, delete a Secret, interrupt a spot node, or break networking.
apiVersion: v1
kind: Namespace
metadata:
  name: aks-platform-triage-smoke
---
apiVersion: v1
kind: Pod
metadata:
  name: critical-log-smoke
  labels:
    app.kubernetes.io/name: critical-log-smoke
    sre.platform.io/triage: "true"
    sre.platform.io/workload-identity: critical-log-smoke
spec:
  restartPolicy: Never
  containers:
  - name: emitter
    image: triage-smoke-image
    command: [sh, -c]
    args: ['echo "CRITICAL platform health probe failed: API dependency unavailable"; sleep 1800']
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 50m, memory: 32Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: error-log-smoke
  labels:
    app.kubernetes.io/name: error-log-smoke
    sre.platform.io/triage: "true"
    sre.platform.io/workload-identity: error-log-smoke
spec:
  restartPolicy: Never
  containers:
  - name: emitter
    image: triage-smoke-image
    command: [sh, -c]
    args: ['echo "ERROR workload identity authentication failed: federated credential rejected"; sleep 1800']
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 50m, memory: 32Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: warning-log-smoke
  labels:
    app.kubernetes.io/name: warning-log-smoke
    sre.platform.io/triage: "true"
    sre.platform.io/workload-identity: warning-log-smoke
spec:
  restartPolicy: Never
  containers:
  - name: emitter
    image: triage-smoke-image
    command: [sh, -c]
    args: ['echo "WARNING platform capacity trend indicates a future scheduling risk"; sleep 1800']
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 50m, memory: 32Mi}
---
# Event target Pods run harmlessly. The Event resources below refer to them.
