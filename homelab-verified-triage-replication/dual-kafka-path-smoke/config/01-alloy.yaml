apiVersion: v1
kind: ConfigMap
metadata:
  name: dual-kafka-alloy-config
  namespace: monitoring
data:
  config.alloy: |
    logging { level = "info" format = "logfmt" }
    discovery.kubernetes "pods" { role = "pod" }
    discovery.relabel "smoke_pods" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex = "dual-kafka-smoke"
        action = "keep"
      }
    }
    loki.source.kubernetes "pod_logs" {
      targets = discovery.relabel.smoke_pods.output
      forward_to = [loki.process.smoke.receiver]
    }
    loki.process "smoke" {
      stage.static_labels { values = { pipeline = "dual-kafka-smoke" } }
      forward_to = [otelcol.receiver.loki.vector.receiver]
    }
    otelcol.receiver.loki "vector" {
      output { logs = [otelcol.processor.batch.vector.input] }
    }
    otelcol.processor.batch "vector" {
      timeout = "1s"
      send_batch_size = 1
      output { logs = [otelcol.exporter.otlphttp.vector.input] }
    }
    otelcol.exporter.otlphttp "vector" {
      client { endpoint = "http://dual-kafka-vector.argo-events.svc.cluster.local:4318" }
      retry_on_failure { enabled = true initial_interval = "1s" max_interval = "10s" max_elapsed_time = "1m" }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dual-kafka-alloy
  namespace: monitoring
  labels: {app: dual-kafka-alloy, app.kubernetes.io/part-of: dual-kafka-path-smoke}
spec:
  replicas: 1
  selector: {matchLabels: {app: dual-kafka-alloy}}
  template:
    metadata:
      labels: {app: dual-kafka-alloy, app.kubernetes.io/part-of: dual-kafka-path-smoke}
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.12.2
          args: [run, /etc/alloy/config.alloy, --server.http.listen-addr=0.0.0.0:12345]
          ports: [{name: http, containerPort: 12345}]
          readinessProbe: {httpGet: {path: /-/ready, port: http}, initialDelaySeconds: 5}
          volumeMounts: [{name: config, mountPath: /etc/alloy, readOnly: true}]
      volumes:
        - name: config
          configMap: {name: dual-kafka-alloy-config}
