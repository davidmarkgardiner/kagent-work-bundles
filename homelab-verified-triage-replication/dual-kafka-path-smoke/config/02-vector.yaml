apiVersion: v1
kind: ConfigMap
metadata:
  name: dual-kafka-vector-config
  namespace: argo-events
data:
  vector.yaml: |
    api: {enabled: true, address: 0.0.0.0:8686}
    sources:
      alloy_otlp:
        type: opentelemetry
        http: {address: 0.0.0.0:4318}
        grpc: {address: 0.0.0.0:4317}
      internal: {type: internal_metrics}
    transforms:
      smoke_only:
        type: filter
        inputs: [alloy_otlp.logs]
        # Alloy OTLP records differ by source/version: one may expose the log
        # line as .message and another as .body. `string()` errors on null, so
        # `??` provides a real fallback instead of calling `contains` on null.
        condition: 'contains(string(.message) ?? string(.body) ?? "", "DUAL-KAFKA-SMOKE")'
      envelope:
        type: remap
        inputs: [smoke_only]
        source: |
          . = {
            "schema_version": "dual-kafka-smoke.v1",
            "pipeline": "dual-kafka-path-smoke",
            "message": string(.message) ?? string(.body) ?? "",
          }
    sinks:
      kafka_a:
        type: kafka
        inputs: [envelope]
        bootstrap_servers: "${KAFKA_BOOTSTRAP}"
        topic: "{{KAFKA_TOPIC_A}}"
        encoding: {codec: json}
        librdkafka_options:
          security.protocol: sasl_ssl
          sasl.mechanism: PLAIN
          sasl.username: "${KAFKA_KEY}"
          sasl.password: "${KAFKA_SECRET}"
      kafka_b:
        type: kafka
        inputs: [envelope]
        bootstrap_servers: "${KAFKA_BOOTSTRAP}"
        topic: "{{KAFKA_TOPIC_B}}"
        encoding: {codec: json}
        librdkafka_options:
          security.protocol: sasl_ssl
          sasl.mechanism: PLAIN
          sasl.username: "${KAFKA_KEY}"
          sasl.password: "${KAFKA_SECRET}"
      metrics:
        type: prometheus_exporter
        inputs: [internal]
        address: 0.0.0.0:9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dual-kafka-vector
  namespace: argo-events
  labels: {app: dual-kafka-vector, app.kubernetes.io/part-of: dual-kafka-path-smoke}
spec:
  replicas: 1
  selector: {matchLabels: {app: dual-kafka-vector}}
  template:
    metadata:
      labels: {app: dual-kafka-vector, app.kubernetes.io/part-of: dual-kafka-path-smoke}
    spec:
      containers:
        - name: vector
          image: timberio/vector:0.45.0-debian
          args: [--config, /etc/vector/vector.yaml]
          env:
            - {name: KAFKA_BOOTSTRAP, valueFrom: {secretKeyRef: {name: confluent-credentials, key: bootstrap}}}
            - {name: KAFKA_KEY, valueFrom: {secretKeyRef: {name: confluent-credentials, key: key}}}
            - {name: KAFKA_SECRET, valueFrom: {secretKeyRef: {name: confluent-credentials, key: secret}}}
          ports:
            - {name: otlp-http, containerPort: 4318}
            - {name: api, containerPort: 8686}
            - {name: prom, containerPort: 9090}
          readinessProbe: {httpGet: {path: /health, port: api}, initialDelaySeconds: 5}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 200m, memory: 256Mi}
          volumeMounts: [{name: config, mountPath: /etc/vector, readOnly: true}]
      volumes:
        - name: config
          configMap: {name: dual-kafka-vector-config}
---
apiVersion: v1
kind: Service
metadata:
  name: dual-kafka-vector
  namespace: argo-events
spec:
  selector: {app: dual-kafka-vector}
  ports:
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: api, port: 8686, targetPort: api}
    - {name: prom, port: 9090, targetPort: prom}
