<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1280" role="img" aria-labelledby="title desc"><title id="title">DICE authentication flow</title><desc id="desc">DICE proposed target design. Solid arrows carry requests or content. Dashed arrows show identity, policy, delivery or telemetry relationships.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="#F4F3EE"/><path d="M180 145 V1170" fill="none" stroke="#CCCABC" stroke-width="2" stroke-dasharray="6 8"/><g class="card"><rect x="30" y="20" width="300" height="120" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M30 20 H330" stroke="#CCCABC" stroke-width="2"/><text x="48" y="60" fill="#1C1C1C" font-family="Arial,Helvetica,sans-serif" font-size="30" text-anchor="start">API client</text><text x="48" y="96" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">UAMI / delegated profile</text></g><path d="M540 145 V1170" fill="none" stroke="#CCCABC" stroke-width="2" stroke-dasharray="6 8"/><g class="card"><rect x="390" y="20" width="300" height="120" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M390 20 H690" stroke="#CCCABC" stroke-width="2"/><text x="408" y="60" fill="#1C1C1C" font-family="Arial,Helvetica,sans-serif" font-size="30" text-anchor="start">Entra ID</text><text x="408" y="96" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Token issuer</text></g><path d="M900 145 V1170" fill="none" stroke="#CCCABC" stroke-width="2" stroke-dasharray="6 8"/><g class="card"><rect x="750" y="20" width="300" height="120" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M750 20 H1050" stroke="#CCCABC" stroke-width="2"/><text x="768" y="60" fill="#1C1C1C" font-family="Arial,Helvetica,sans-serif" font-size="30" text-anchor="start">API + Gateway</text><text x="768" y="96" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">JWT and route policy</text></g><path d="M1260 145 V1170" fill="none" stroke="#CCCABC" stroke-width="2" stroke-dasharray="6 8"/><g class="card"><rect x="1110" y="20" width="300" height="120" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M1110 20 H1410" stroke="#CCCABC" stroke-width="2"/><text x="1128" y="60" fill="#1C1C1C" font-family="Arial,Helvetica,sans-serif" font-size="30" text-anchor="start">Agent runtime</text><text x="1128" y="96" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Trusted credential adapter</text></g><path d="M1620 145 V1170" fill="none" stroke="#CCCABC" stroke-width="2" stroke-dasharray="6 8"/><g class="card"><rect x="1470" y="20" width="300" height="120" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M1470 20 H1770" stroke="#CCCABC" stroke-width="2"/><text x="1488" y="60" fill="#1C1C1C" font-family="Arial,Helvetica,sans-serif" font-size="30" text-anchor="start">MCP service</text><text x="1488" y="96" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Separate backend identity</text></g><path d="M180 220 H540" fill="none" stroke="#E60000" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M540 300 H180" fill="none" stroke="#E60000" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M180 400 H900" fill="none" stroke="#1C1C1C" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M900 580 H1260" fill="none" stroke="#1C1C1C" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M1260 690 H540" fill="none" stroke="#E60000" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M540 790 H1260" fill="none" stroke="#E60000" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M1260 890 H900" fill="none" stroke="#1C1C1C" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M900 990 H1620" fill="none" stroke="#1C1C1C" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M1620 1090 H900" fill="none" stroke="#1C1C1C" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M900 1170 H1260" fill="none" stroke="#1C1C1C" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M900 435 H1030 V500 H900" fill="none" stroke="#E60000" stroke-width="2.6" marker-end="url(#arrow)"/><text data-wire-label="true" paint-order="stroke" stroke="#F4F3EE" stroke-width="7" stroke-linejoin="round" x="360.0" y="200" fill="#1C1C1C" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle">1 Acquire agent-API token</text><text data-wire-label="true" paint-order="stroke" stroke="#F4F3EE" stroke-width="7" stroke-linejoin="round" x="360.0" y="280" fill="#1C1C1C" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle">2 Token for agent API</text><text data-wire-label="true" paint-order="stroke" stroke="#F4F3EE" stroke-width="7" stroke-linejoin="round" x="540.0" y="380" fill="#1C1C1C" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle">3 HTTPS invocation with caller token</text><text data-wire-label="true" paint-order="stroke" stroke="#F4F3EE" stroke-width="7" stroke-linejoin="round" x="1080.0" y="560" fill="#1C1C1C" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle">5 Invoke the authorized agent</text><text data-wire-label="true" paint-order="stroke" stroke="#F4F3EE" stroke-width="7" stroke-linejoin="round" x="900.0" y="670" fill="#1C1C1C" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle">6 Adapter requests approved MCP-API access</text><text data-wire-label="true" paint-order="stroke" stroke="#F4F3EE" stroke-width="7" stroke-linejoin="round" x="900.0" y="770" fill="#1C1C1C" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle">7 Agent token for the MCP API</text><text data-wire-label="true" paint-order="stroke" stroke="#F4F3EE" stroke-width="7" stroke-linejoin="round" x="1080.0" y="870" fill="#1C1C1C" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle">8 MCP operation and agent token</text><text data-wire-label="true" paint-order="stroke" stroke="#F4F3EE" stroke-width="7" stroke-linejoin="round" x="1260.0" y="970" fill="#1C1C1C" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle">9 Authorize agent, audience and operation; forward</text><text data-wire-label="true" paint-order="stroke" stroke="#F4F3EE" stroke-width="7" stroke-linejoin="round" x="1260.0" y="1070" fill="#1C1C1C" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle">10 Return bounded MCP result</text><text data-wire-label="true" paint-order="stroke" stroke="#F4F3EE" stroke-width="7" stroke-linejoin="round" x="1080.0" y="1150" fill="#1C1C1C" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="middle">11 Return tool result to runtime</text><text data-wire-label="true" paint-order="stroke" stroke="#F4F3EE" stroke-width="7" stroke-linejoin="round" x="920" y="530" fill="#DA0000" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="start">4 Validate token and caller permission for this agent</text><text data-wire-label="true" paint-order="stroke" stroke="#F4F3EE" stroke-width="7" stroke-linejoin="round" x="40" y="1240" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="22" text-anchor="start">The agent-API and MCP-API tokens have destination-specific audiences. Keep credentials out of prompts, logs and tool bodies.</text></svg>
