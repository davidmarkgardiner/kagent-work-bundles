<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 870" role="img" aria-labelledby="title desc"><title id="title">DICE evaluation and observability lifecycle</title><desc id="desc">DICE proposed target design. Solid arrows carry requests or content. Dashed arrows show identity, policy, delivery or telemetry relationships.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="#F4F3EE"/><path d="M440 200 H560" fill="none" stroke="#1C1C1C" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M1060 200 H1180" fill="none" stroke="#1C1C1C" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M1540 200 H1640" fill="none" stroke="#1C1C1C" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M1760 300 V430" fill="none" stroke="#1C1C1C" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M1640 530 H1540" fill="none" stroke="#1C1C1C" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M1180 530 H1060" fill="none" stroke="#1C1C1C" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M560 530 H440" fill="none" stroke="#E60000" stroke-width="2.6" stroke-dasharray="9 7" marker-end="url(#arrow)"/><path d="M240 430 V340 H1360 V300" fill="none" stroke="#E60000" stroke-width="2.6" stroke-dasharray="9 7" marker-end="url(#arrow)"/><path d="M240 660 V760 H700" fill="none" stroke="#E60000" stroke-width="2.6" stroke-dasharray="9 7" marker-end="url(#arrow)"/><path d="M810 660 V710" fill="none" stroke="#5A5D5C" stroke-width="2.6" stroke-dasharray="9 7" marker-end="url(#arrow)"/><g class="card"><rect x="40" y="95" width="400" height="205" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M40 95 H440" stroke="#CCCABC" stroke-width="2"/><text x="58" y="135" fill="#1C1C1C" font-family="Arial,Helvetica,sans-serif" font-size="30" text-anchor="start">Candidate release</text><text x="58" y="171" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Agent and instruction version</text><text x="58" y="199" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Skill and MCP release</text><text x="58" y="227" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Model route and policy version</text><text x="58" y="255" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Evaluator and case version</text></g><g class="card"><rect x="560" y="95" width="500" height="205" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M560 95 H1060" stroke="#E60000" stroke-width="4"/><text x="578" y="135" fill="#1C1C1C" font-family="Arial,Helvetica,sans-serif" font-size="30" text-anchor="start">Release evaluations</text><text x="578" y="171" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Contract and task behavior</text><text x="578" y="199" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Native skill and tool accuracy</text><text x="578" y="227" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Identity and isolation checks</text><text x="578" y="255" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Limits, errors and model compatibility</text></g><g class="card"><rect x="1180" y="95" width="360" height="205" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M1180 95 H1540" stroke="#CCCABC" stroke-width="2"/><text x="1198" y="135" fill="#1C1C1C" font-family="Arial,Helvetica,sans-serif" font-size="30" text-anchor="start">Evaluation receipt</text><text x="1198" y="171" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Exact candidate binding</text><text x="1198" y="199" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Scores + hard policy gates</text><text x="1198" y="227" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Evidence and provenance</text><text x="1198" y="255" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">PASS / FAIL / UNKNOWN</text></g><g class="card"><rect x="1640" y="95" width="240" height="205" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M1640 95 H1880" stroke="#CCCABC" stroke-width="2"/><text x="1658" y="135" fill="#1C1C1C" font-family="Arial,Helvetica,sans-serif" font-size="30" text-anchor="start">Release review</text><text x="1658" y="171" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Existing approval</text><text x="1658" y="199" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Promotion policy</text><text x="1658" y="227" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">No automatic</text><text x="1658" y="255" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">production writes</text></g><g class="card"><rect x="1640" y="430" width="240" height="230" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M1640 430 H1880" stroke="#CCCABC" stroke-width="2"/><text x="1658" y="470" fill="#1C1C1C" font-family="Arial,Helvetica,sans-serif" font-size="30" text-anchor="start">Flux + KRO</text><text x="1658" y="506" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Apply reviewed</text><text x="1658" y="534" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">agent and policy</text><text x="1658" y="562" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">revision; verify</text><text x="1658" y="590" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">convergence</text></g><g class="card"><rect x="1180" y="430" width="360" height="230" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M1180 430 H1540" stroke="#CCCABC" stroke-width="2"/><text x="1198" y="470" fill="#1C1C1C" font-family="Arial,Helvetica,sans-serif" font-size="30" text-anchor="start">Running agent</text><text x="1198" y="506" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Protected API requests</text><text x="1198" y="534" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Approved skill/MCP/model use</text><text x="1198" y="562" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Native outcome receipts</text><text x="1198" y="590" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Correlated operations</text></g><g class="card"><rect x="560" y="430" width="500" height="230" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M560 430 H1060" stroke="#CCCABC" stroke-width="2"/><text x="578" y="470" fill="#1C1C1C" font-family="Arial,Helvetica,sans-serif" font-size="30" text-anchor="start">Observability</text><text x="578" y="506" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">OTel / Alloy into LGTM</text><text x="578" y="534" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Traces · logs · metrics</text><text x="578" y="562" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Reported usage and cost provenance</text><text x="578" y="590" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Metadata-first collection</text></g><g class="card"><rect x="40" y="430" width="400" height="230" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M40 430 H440" stroke="#E60000" stroke-width="4"/><text x="58" y="470" fill="#1C1C1C" font-family="Arial,Helvetica,sans-serif" font-size="30" text-anchor="start">Runtime evaluation</text><text x="58" y="506" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Approved cases or samples</text><text x="58" y="534" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Own data/identity/spend scope</text><text x="58" y="562" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Functional and security results</text><text x="58" y="590" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Findings feed operations review</text></g><g class="card"><rect x="700" y="710" width="1180" height="115" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M700 710 H1880" stroke="#CCCABC" stroke-width="2"/><text x="718" y="750" fill="#1C1C1C" font-family="Arial,Helvetica,sans-serif" font-size="30" text-anchor="start">Central registry and evidence store</text><text x="718" y="786" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="21" text-anchor="start">Bind release, policy, tool, model and evaluator versions to their acceptance receipts.</text></g><text data-wire-label="true" paint-order="stroke" stroke="#F4F3EE" stroke-width="7" stroke-linejoin="round" x="1740" y="380" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="end">Approved revision</text><text data-wire-label="true" paint-order="stroke" stroke="#F4F3EE" stroke-width="7" stroke-linejoin="round" x="1110" y="505" fill="#5A5D5C" font-family="Arial,Helvetica,sans-serif" font-size="20" text-anchor="middle">OTel</text><text data-wire-label="true" paint-order="stroke" stroke="#F4F3EE" stroke-width="7" stroke-linejoin="round" x="500" y="505" fill="#DA0000" font-family="Arial,Helvetica,sans-serif" font-size="19" text-anchor="middle">Evidence</text><text data-