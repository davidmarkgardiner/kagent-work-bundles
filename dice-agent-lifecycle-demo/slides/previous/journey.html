  "sources": {
    "catalog": {
      "title": "Approved startup catalog",
      "text": "Illustrative catalog, not an inventory of installed services.\nModels: approved-general, approved-code, approved-data.\nSkills: platform-triage, gitlab-review, data-dictionary.\nTools: kubernetes-readonly, gitlab-readonly, denodo-readonly, kagent-tools-readonly.\nCustomer picks identifiers; the platform resolves immutable reviewed definitions.\nOnly selected tool names are exposed. The server and its credentials enforce real permissions.\nDiscovery is required before using actual MCP names. No generic write/delete tools in the read-only demonstration.",
      "type": "Illustrative design and configuration notes"
    },
    "comparison": {
      "title": "Fair native versus composed comparison",
      "text": "Same inputs on both sides: system prompt, approved ModelConfig, selected skills and read-only MCP bindings.\nNative Agent alone: kagent reconciles its runtime and Service. Surrounding Gateway authentication, network isolation, verification and audit configuration need separate platform work.\nClassicSecureAgent composition: KRO creates the native Agent plus the prescribed identities, routes, JWT policies, network intent and Golden verifier.\nDemonstrate the value with paired allowed and denied requests, not with a deliberately privileged baseline.\nNormal kagent can also be secured manually. This comparison is about repeatable assembly.\nA successful model PONG does not prove MCP authorization or CNI enforcement.",
      "type": "Illustrative design and configuration notes"
    },
    "customer": {
      "title": "Customer intent",
      "type": "Synthetic customer YAML",
      "text": "# Illustration only. Generic values, not a deployment instruction.\napiVersion: demo.kagent.dev/v1alpha1\nkind: ClassicSecureAgent\nmetadata:\n  name: sample-agent\n  namespace: demo-agents\nspec:\n  modelConfig: approved-example\n  systemPrompt: Answer using approved information.\n  skills: [reviewed-guidance]\n  tools: [inventory-readonly]\n"
    },
    "dashboards": {
      "title": "LGTM views",
      "text": "Loki: sanitized errors, auth failures and tool-call audit metadata.\nTempo: actual spans across request, model and MCP operations, linked by real trace context.\nMimir: request count, latency, error rate and actual token usage where emitted.\nGrafana: task/trace drill-down, model/route usage, policy denials and application rollout/health.\nIllustrative panel names, no invented dashboard values or live green badges.\nAuthentication failures, tool permission failures and model/provider failures need separate views.\nSampling, missing instrumentation and retention can leave gaps. Check coverage explicitly.",
      "type": "Illustrative design and configuration notes"
    },
    "denodo": {
      "title": "Denodo MCP",
      "text": "Illustrative data assistant binding.\nRemoteMCPServer points to the approved Denodo MCP endpoint.\nExpose reviewed metadata and bounded read-only data operations only.\nThe data platform enforces views, grants and result limits; a prompt cannot confer permission.\nExample audience question: Which approved dataset contains the service-level measure?\nProof needed: actual MCP call record, authorized bounded result and a denied unapproved operation.\nNo Denodo endpoint, credentials or live results are embedded.",
      "type": "Illustrative design and configuration notes"
    },
    "gateway-policy": {
      "title": "Gateway policy layers",
      "text": "Policy capability map. Validate fields against the installed AgentgatewayPolicy CRD.\nComposed demo: protected HTTPRoutes, strict JWT checks and caller/verifier identity separation.\nFrontend options: listener TLS/mTLS setup, connection controls, access logs, tracing and metrics.\nTraffic options: JWT issuer/audience checks, CEL authorization, external auth, request and token rate limits.\nBackend options: approved provider auth, verified TLS, model aliases/routes and selected MCP tool authorization.\nReferenceGrant is required only for a supported cross-namespace backend reference. It is consent to reference, not runtime authentication.\nExact model/MCP routing, credentials and backend grants must be configured independently.\nPrimary reference: https://agentgateway.dev/docs/kubernetes/latest/documentation/security/",
      "type": "Illustrative design and configuration notes"
    },
    "gitlab": {
      "title": "GitLab MCP",
      "text": "Read-only demo: inspect issues, repository files and pipeline status in an approved project.\nDelivery demonstration: a separate write-capable identity exposes only reviewed branch/file/draft-MR operations.\nDo not reuse delivery credentials for the read-only agent.\nCreating an MR is not approval to merge. Require human review and exact-head checks.\nExample question: Summarize the failing pipeline and its associated change.\nTool names must come from the deployed MCP server's discovery response.",
      "type": "Illustrative design and configuration notes"
    },
    "golden": {
      "title": "Golden verification",
      "type": "Synthetic Job / token contract excerpt",
      "text": "apiVersion: batch/v1\nkind: Job\nmetadata:\n  name: sample-golden\nspec:\n  backoffLimit: 0\n  # Container, ConfigMap and network settings omitted.\n  template:\n    spec:\n      serviceAccountName: sample-verifier\n      automountServiceAccountToken: false\n      restartPolicy: Never\n      volumes:\n        - name: verifier-token\n          projected:\n            sources:\n              - serviceAccountToken:\n                  audience: illustrative-agent\n                  expirationSeconds: 600\n                  path: token\n# One actual model request is required by a real run.\n"
    },
    "graph": {
      "title": "KRO resource graph",
      "type": "Synthetic, abbreviated RGD excerpt",
      "text": "apiVersion: kro.run/v1alpha1\nkind: ResourceGraphDefinition\nmetadata:\n  name: illustrative-secure-agent\nspec:\n  # Schema, catalogs and other resources omitted.\n  resources:\n    - id: golden\n      readyWhen:\n        - ${golden.status.succeeded == 1}\n      template:\n        apiVersion: batch/v1\n        kind: Job\n        # Full verifier template omitted.\n    - id: callerRoute\n      template:\n        apiVersion: gateway.networking.k8s.io/v1\n        kind: HTTPRoute\n        metadata:\n          annotations:\n            demo.example/verified-job: ${golden.metadata.name}\n# Dependency: callerRoute waits for golden readiness.\n"
    },
    "kagent-tools": {
      "title": "kagent tools and delegation",
      "text": "kagent-tools can expose Kubernetes and other integration tools through MCP.\nSelect an explicit allowlist of discovered tool names and keep credentials scoped.\nA native Agent may also reference another approved Agent as a tool when supported and configured.\nAn Agent reference is distinct from a RemoteMCPServer reference.\nDelegation does not expand the caller's authorized task or turn every tool into a safe operation.\nThis catalog illustration does not assert those services are installed.",
      "type": "Illustrative design and configuration notes"
    },
    "kubernetes": {
      "title": "Kubernetes MCP",
      "text": "Approved namespace-scoped read operations for pods, workload status and events.\nNo apply, delete, exec or resource-changing tools in the comparison baseline.\nUse workload identity and Kubernetes RBAC to enforce actual scope.\nExample question: Which workload has unavailable replicas, and what observed event explains it?\nAn Agent's tool list guides available operations; backend authorization enforces access.",
      "type": "Illustrative design and configuration notes"
    },
    "lifecycle": {
      "title": "Agent lifecycle and change controls",
      "text": "1 Author intent using approved prompt, model, skills and tools.\n2 Admit schema/catalog and create native Agent plus security dependencies.\n3 Run Golden and record an actual model-backed response before caller route creation.\n4 Serve through the authenticated route and enforce backend permissions.\n5 Observe real usage, traces, failures and policy decisions.\n6 On material changes, retire caller access and verify again. A completed Job is not continuous revocation.\n7 Retire agent, routes, credentials and generated resources using controlled lifecycle ownership.\nFuture identity extension: approved Entra caller claims and separately scoped workload identity/UAMI for tools.",
      "type": "Illustrative design and configuration notes"
    },
    "otel": {
      "title": "OTel pipeline",
      "text": "Reference observability wiring, not proof that dashboards received telemetry.\nInstrument native agent, Gateway and MCP services where supported.\nPropagate trace context and task/tool-call metadata; never manufacture missing parents or spans.\nOTel Collector receives configured telemetry, sanitizes attributes and exports to selected backends.\nUse Loki for logs, Tempo for traces and Mimir for metrics. Grafana queries those backends.\nSome existing platform components may emit directly to their backend; configure receivers/exporters to match.\nNo raw credentials, prompt bodies or tool results should be exported by default.\nVerify one real request end to end, including collector receipt and retained trace/usage counters.",
      "type": "Illustrative design and configuration notes"
    },
    "security": {
      "title": "What KRO adds",
      "type": "Illustrative ownership inventory",
      "text": "KRO-managed envelope\n  Native Agent\n  Runtime / verifier / caller ServiceAccounts\n  Agent and verifier NetworkPolicies\n  Verifier and caller JWT / authorization policies\n  AgentCard and verification HTTPRoutes\n  Golden ConfigMap and Job\n  Caller HTTPRoute, after Golden succeeds\n\nPlatform-owned prerequisites\n  Approved ModelConfig and MCP backends\n  Gateway and strict listener policies\n  Controller permissions, identity and observability\n\nkagent-owned output\n  Normal Deployment, Service and configuration Secret\n"
    },
    "skill-mount": {
      "title": "Skills initialization and mount",
      "text": "Native kagent's skills-init loads reviewed sources into a shared volume at /skills.\nGitLab is a Git source, not a bespoke front-door ConfigMap mount.\nPin immutable Git commits or OCI digests; use the installed schema for other source types.\nUse a compatible full runtime image, source-auth Secret and approved fetch egress.\nA skill contains SKILL.md instructions and may include supporting files or executable material.\nA knowledge-base document is content. It does not become a skill or access permission just because it is Markdown.\nReview source provenance and scripts. Mounting instructions never grants RBAC or data access.\nVerify the selected revision and a task actually using the skill.",
      "type": "Illustrative design and configuration notes"
    },
    "skill-native": {
      "title": "Native skill loading example",
      "text": "# Synthetic native kagent 0.x excerpt. Not a complete deployment.\napiVersion: kagent.dev/v1alpha2\nkind: Agent\nmetadata:\n  name: sample-specialist\nspec:\n  type: Declarative\n  skills:\n    gitRefs:\n      - url: https://gitlab.example.invalid/demo/approved-skills.git\n        ref: \"{{IMMUTABLE_COMMIT_SHA}}\"\n        path: skills/platform-triage\n        name: platform-triage\n    gitAuthSecretRef:\n      name: approved-skills-reader\n  declarative:\n    modelConfig: approved-general\n    systemMessage: Use the selected runbook and approved tools.\n# The customer composition selects catalog IDs; the platform resolves this shape.\n# Native skills initialization loads the shared /skills volume.\n# Use the matching full runtime image for skills, not a slim image lacking support.\n# Fetch credentials and narrowly allowed source egress are separate prerequisites.",
      "type": "Synthetic native Agent YAML excerpt"
    },
    "usage": {
      "title": "Token usage, attribution and budgets",
      "text": "Capture actual provider input/output token counters when available.\nCorrelate identity, task, selected model, route, policy decision, latency and tool spans.\nShow unknown for absent usage. Never infer tokens from a coloured diagram or a guessed character ratio.\nRequest limits and LLM-token limits are separate controls.\nLocal counters apply per proxy replica; global budgets require a coordinating service.\nPost-response token accounting can overshoot during in-flight responses. It is not a hard mid-generation spend cutoff.\nCost estimates need an approved pricing catalog and model mapping.\nRedact secrets and sensitive prompt/tool contents before telemetry export.\nPrimary reference: https://agentgateway.dev/docs/kubernetes/latest/documentation/llm/rate-limit/",
      "type": "Illustrative design and configuration notes"
    },
    "resource-agent": {
      "title": "1 × Agent — useful behavior",
      "type": "Checked KRO catalog templates · illustrative, unresolved CEL",
      "text": "WHY: Define the useful agent once; kagent turns this declaration into its native runtime. The selected skill references, model name and MCP operations are part of this declaration.\n\nWHY THESE RESOURCES EXIST\nNative kagent Agent: KRO passes the system prompt, existing ModelConfig name and selected MCP operations to the normal declarative Agent. kagent creates the Deployment, Service and generated configuration Secret.\n\nSOURCE TEMPLATES\n# KRO template from spec.resources. CEL is resolved by KRO.\napiVersion: kagent.dev/v1alpha2\nkind: Agent\nmetadata:\n  name: ${schema.metadata.name}\n  namespace: ${schema.metadata.namespace}\nspec:\n  type: Declarative\n  description: KRO-composed native agent without Substrate\n  declarative:\n    runtime: go\n    modelConfig: ${schema.spec.modelConfig}\n    systemMessage: ${schema.spec.systemPrompt}\n    stream: false\n    tools: ${schema.spec.tools.map(id, {\"kubernetes-readonly\":dyn({\"type\":dyn(\"McpServer\"),\"mcpServer\":dyn({\"apiGroup\":dyn(\"kagent.dev\"),\"kind\":dyn(\"RemoteMCPServer\"),\"name\":dyn(\"approved-kubernetes-mcp\"),\"toolNames\":dyn([dyn(\"k8s_get_resources\"),dyn(\"k8s_get_events\")])})}),\"gitlab-readonly\":dyn({\"type\":dyn(\"McpServer\"),\"mcpServer\":dyn({\"apiGroup\":dyn(\"kagent.dev\"),\"kind\":dyn(\"RemoteMCPServer\"),\"name\":dyn(\"approved-gitlab-mcp\"),\"toolNames\":dyn([dyn(\"gitlab_get_project\"),dyn(\"gitlab_get_latest_pipeline\")])})}),\"denodo-readonly\":dyn({\"type\":dyn(\"McpServer\"),\"mcpServer\":dyn({\"apiGroup\":dyn(\"kagent.dev\"),\"kind\":dyn(\"RemoteMCPServer\"),\"name\":dyn(\"approved-denodo-mcp\"),\"toolNames\":dyn([dyn(\"get_inventory_data_product_details\"),dyn(\"get_namespace_count\"),dyn(\"get_namespace_summary\")])})})}[id])}\n    deployment:\n      serviceAccountName: ${runtimeAccount.metadata.name}\n      resources:\n        requests:\n          cpu: 25m\n          memory: 64Mi\n        limits:\n          cpu: 1000m\n          memory: 256Mi\n      env:\n      - name: HOME\n        value: /tmp\n      podSecurityContext:\n        runAsNonRoot: true\n        runAsUser: 1000\n        fsGroup: 1000\n        seccompProfile:\n          type: RuntimeDefault\n      securityContext:\n        allowPrivilegeEscalation: false\n        readOnlyRootFilesystem: true\n        capabilities:\n          drop:\n          - ALL\n      volumes:\n      - name: writable-tmp\n        emptyDir:\n          sizeLimit: 64Mi\n      volumeMounts:\n      - name: writable-tmp\n        mountPath: /tmp\n  skills:\n    gitRefs: ${schema.spec.skills.map(id, {\"work-guidance\":dyn({\"url\":dyn(\"{{APPROVED_GITLAB_SKILLS_REPOSITORY_URL}}\"),\"ref\":dyn(\"{{APPROVED_FULL_COMMIT_ID}}\"),\"path\":dyn(\"skills/work-guidance\"),\"name\":dyn(\"work-guidance\")})}[id])}\n    gitAuthSecretRef:\n      name: approved-git-credentials\n"
    },
    "resource-identities": {
      "title": "3 × ServiceAccount — separate identities",
      "type": "Checked KRO catalog templates · illustrative, unresolved CEL",
      "text": "WHY: Keep the running agent, one-shot verifier and API caller distinct. Front-door access does not confer backend permissions.\n\nWHY THESE RESOURCES EXIST\nRuntime identity: No Kubernetes API token is automounted into the native agent. Backend permissions remain separate from chat access. The native controller separately projects a one-hour JWT with audience kagent for its own API, visible in the recorded Deployment.\nGolden identity: The verifier gets only an audience-specific, short-lived projected JWT. It has no Role or RoleBinding to the Kubernetes API.\nCaller identity: Only the exact demo-caller subject is accepted on the caller listener. Minting its JWT requires the operator token-request permission.\n\nSOURCE TEMPLATES\n# KRO template from spec.resources. CEL is resolved by KRO.\napiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: ${schema.metadata.name}-runtime\n  namespace: ${schema.metadata.namespace}\nautomountServiceAccountToken: false\n---\n# KRO template from spec.resources. CEL is resolved by KRO.\napiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: ${schema.metadata.name}-verifier\n  namespace: ${schema.metadata.namespace}\nautomountServiceAccountToken: false\n---\n# KRO template from spec.resources. CEL is resolved by KRO.\napiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: ${schema.metadata.name}-caller\n  namespace: ${schema.metadata.namespace}\nautomountServiceAccountToken: false\n"
    },
    "resource-network": {
      "title": "2 × NetworkPolicy — constrain network paths",
      "type": "Checked KRO catalog templates · illustrative, unresolved CEL",
      "text": "WHY: Express separate agent and verifier network boundaries. This is manifest intent; CNI enforcement and denied-traffic tests are required before claiming isolation.\n\nWHY THESE RESOURCES EXIST\nAgent network boundary: Ingress is limited to the approved Gateway pods. Egress permits only the resolved DNS, model, controller and reviewed tool paths. DNS and backend permissions are still separate controls. This is policy intent; enforcement requires a supporting CNI and actual denied-traffic tests, which are not part of the recorded PONG proof.\nVerifier network boundary: All verifier ingress is denied. Its only egress paths are DNS and the two Gateway listeners, including the caller lane used for a negative control.\n\nSOURCE TEMPLATES\n# KRO template from spec.resources. CEL is resolved by KRO.\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: ${schema.metadata.name}-boundary\n  namespace: ${schema.metadata.namespace}\nspec:\n  podSelector:\n    matchLabels:\n      app: kagent\n      kagent: ${schema.metadata.name}\n  policyTypes:\n  - Ingress\n  - Egress\n  ingress:\n  - from:\n    - namespaceSelector:\n        matchLabels:\n          kubernetes.io/metadata.name: classic-agents\n      podSelector:\n        matchLabels:\n          gateway.networking.k8s.io/gateway-name: classic-demo\n    ports:\n    - protocol: TCP\n      port: 8080\n  egress:\n  - to:\n    - namespaceSelector:\n        matchLabels:\n          kubernetes.io/metadata.name: kube-system\n    ports:\n    - protocol: UDP\n      port: 53\n    - protocol: TCP\n      port: 53\n  - to:\n    - namespaceSelector:\n        matchLabels:\n          kubernetes.io/metadata.name: '{{MODEL_GATEWAY_NAMESPACE}}'\n      podSelector:\n        matchLabels:\n          app: '{{MODEL_GATEWAY_POD_LABEL}}'\n    ports:\n    - protocol: TCP\n      port: 8081\n  - to:\n    - namespaceSelector:\n        matchLabels:\n          kubernetes.io/metadata.name: '{{KAGENT_CONTROLLER_NAMESPACE}}'\n      podSelector:\n        matchLabels:\n          app.kubernetes.io/name: '{{KAGENT_CONTROLLER_LABEL}}'\n    ports:\n    - protocol: TCP\n      port: 8083\n---\n# KRO template from spec.resources. CEL is resolved by KRO.\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: ${schema.metadata.name}-verifier\n  namespace: ${schema.metadata.namespace}\nspec:\n  podSelector:\n    matchLabels:\n      classic.kagent.dev/verifier: ${schema.metadata.name}\n  policyTypes:\n  - Ingress\n  - Egress\n  egress:\n  - to:\n    - namespaceSelector:\n        matchLabels:\n          kubernetes.io/metadata.name: kube-system\n    ports:\n    - protocol: UDP\n      port: 53\n    - protocol: TCP\n      port: 53\n  - to:\n    - namespaceSelector:\n        matchLabels:\n          kubernetes.io/metadata.name: classic-agents\n      podSelector:\n        matchLabels:\n          gateway.networking.k8s.io/gateway-name: classic-demo\n    ports:\n    - protocol: TCP\n      port: 8080\n    - protocol: TCP\n      port: 8081\n"
    },
    "resource-policies": {
      "title": "3 × AgentgatewayPolicy — protect each route",
      "type": "Checked KRO catalog templates · illustrative, unresolved CEL",
      "text": "WHY: Require strict JWT authentication and the exact caller or verifier subject at the Gateway. These policies protect AgentCard, verification and caller routes separately. JWT expiry is validated by the strict JWT implementation; this deck does not execute token tests.\n\nWHY THESE RESOURCES EXIST\nAgentCard policy: The Golden identity can inspect the native AgentCard. Anonymous callers and malformed tokens are denied.\nVerifier route policy: Strict JWT validation checks issuer and audience. Authorization requires the verifier service-account subject.\nCaller route policy: Strict JWT validation and exact caller subject protect invocation. This policy does not give the caller Kubernetes or MCP execution permissions.\n\nSOURCE TEMPLATES\n# KRO template from spec.resources. CEL is resolved by KRO.\napiVersion: agentgateway.dev/v1alpha1\nkind: AgentgatewayPolicy\nmetadata:\n  name: ${schema.metadata.name}-card\n  namespace: ${schema.metadata.namespace}\nspec:\n  targetRefs:\n  - group: gateway.networking.k8s.io\n    kind: HTTPRoute\n    name: ${schema.metadata.name}-card\n  traffic:\n    jwtAuthentication:\n      mode: Strict\n      preserveToken: false\n      providers:\n      - issuer: '{{KUBERNETES_SERVICE_ACCOUNT_ISSUER}}'\n        audiences:\n        - secure-agent-classic\n        jwks:\n          inline: '{{KUBERNETES_JWKS_JSON}}'\n    authorization:\n      action: Require\n      policy:\n        matchExpressions:\n        - jwt.sub == \"system:serviceaccount:classic-agents:${schema.metadata.name}-verifier\"\n---\n# KRO template from spec.resources. CEL is resolved by KRO.\napiVersion: agentgateway.dev/v1alpha1\nkind: AgentgatewayPolicy\nmetadata:\n  name: ${schema.metadata.name}-verify\n  namespace: ${schema.metadata.namespace}\nspec:\n  targetRefs:\n  - group: gateway.networking.k8s.io\n    kind: HTTPRoute\n    name: ${schema.metadata.name}-verify\n  traffic:\n    jwtAuthentication:\n      mode: Strict\n      preserveToken: false\n      providers:\n      - issuer: '{{KUBERNETES_SERVICE_ACCOUNT_ISSUER}}'\n        audiences:\n        - secure-agent-classic\n        jwks:\n          inline: '{{KUBERNETES_JWKS_JSON}}'\n    authorization:\n      action: Require\n      policy:\n        matchExpressions:\n        - jwt.sub == \"system:serviceaccount:classic-agents:${schema.metadata.name}-verifier\"\n---\n# KRO template from spec.resources. CEL is resolved by KRO.\napiVersion: agentgateway.dev/v1alpha1\nkind: AgentgatewayPolicy\nmetadata:\n  name: ${schema.metadata.name}-invoke\n  namespace: ${schema.metadata.namespace}\nspec:\n  targetRefs:\n  - group: gateway.networking.k8s.io\n    kind: HTTPRoute\n    name: ${schema.metadata.name}-invoke\n  traffic:\n    jwtAuthentication:\n      mode: Strict\n      preserveToken: false\n      providers:\n      - issuer: '{{KUBERNETES_SERVICE_ACCOUNT_ISSUER}}'\n        audiences:\n        - secure-agent-classic\n        jwks:\n          inline: '{{KUBERNETES_JWKS_JSON}}'\n    authorization:\n      action: Require\n      policy:\n        matchExpressions:\n        - jwt.sub == \"system:serviceaccount:classic-agents:${schema.metadata.name}-caller\"\n"
    },
    "resource-routes": {
      "title": "3 × HTTPRoute — give each API path a purpose",
      "type": "Checked KRO catalog templates · illustrative, unresolved CEL",
      "text": "WHY: HTTPRoute connects a precise public path to the native agent Service; it is routing, not authentication. AgentgatewayPolicy supplies the checks.\n\nTHREE DESTINATIONS\n1. AgentCard discovery: Golden inspects the exact card path on the verification listener.\n2. Verification invocation: Golden calls the exact verification path, rewritten to the native A2A endpoint.\n3. Caller invocation: approved callers use a separate invocation path after Golden succeeds.\n\nWHY THESE RESOURCES EXIST\nAgentCard route: Only the verification listener exposes the exact AgentCard path. Route status must report Accepted and ResolvedRefs.\nGolden invocation route: The verifier-only listener rewrites the exact verification path to the native A2A endpoint. It is distinct from the customer invocation route.\nCustomer invocation route: The annotation references the Golden Job. KRO waits for that Job to succeed before creating the caller route. A successful Job is a recorded gate, not continuous reapproval or revocation.\n\nSOURCE TEMPLATES\n# KRO template from spec.resources. CEL is resolved by KRO.\napiVersion: gateway.networking.k8s.io/v1\nkind: HTTPRoute\nmetadata:\n  name: ${schema.metadata.name}-card\n  namespace: ${schema.metadata.namespace}\n  annotations:\n    classic.kagent.dev/policy: ${cardPolicy.metadata.name}\nspec:\n  parentRefs:\n  - name: classic-demo\n    namespace: classic-agents\n    sectionName: verify\n  rules:\n  - matches:\n    - path:\n        type: Exact\n        value: /classic/classic-agents/${schema.metadata.name}/card\n    filters:\n    - type: URLRewrite\n      urlRewrite:\n        path:\n          type: ReplaceFullPath\n          replaceFullPath: /.well-known/agent-card.json\n    backendRefs:\n    - name: ${agent.metadata.name}\n      namespace: ${agent.metadata.namespace}\n      port: 8080\n---\n# KRO template from spec.resources. CEL is resolved by KRO.\napiVersion: gateway.networking.k8s.io/v1\nkind: HTTPRoute\nmetadata:\n  name: ${schema.metadata.name}-verify\n  namespace: ${schema.metadata.namespace}\n  annotations:\n    classic.kagent.dev/policy: ${verifierPolicy.metadata.name}\nspec:\n  parentRefs:\n  - name: classic-demo\n    namespace: classic-agents\n    sectionName: verify\n  rules:\n  - matches:\n    - path:\n        type: Exact\n        value: /classic/classic-agents/${schema.metadata.name}/verify\n    filters:\n    - type: URLRewrite\n      urlRewrite:\n        path:\n          type: ReplaceFullPath\n          replaceFullPath: /\n    backendRefs:\n    - name: ${agent.metadata.name}\n      namespace: ${agent.metadata.namespace}\n      port: 8080\n---\n# KRO template from spec.resources. CEL is resolved by KRO.\napiVersion: gateway.networking.k8s.io/v1\nkind: HTTPRoute\nmetadata:\n  name: ${schema.metadata.name}-invoke\n  namespace: ${schema.metadata.namespace}\n  annotations:\n    classic.kagent.dev/policy: ${callerPolicy.metadata.name}\n    classic.kagent.dev/verified-job: ${golden.metadata.name}\nspec:\n  parentRefs:\n  - name: classic-demo\n    namespace: classic-agents\n    sectionName: caller\n  rules:\n  - matches:\n    - path:\n        type: Exact\n        value: /classic/classic-agents/${schema.metadata.name}/invoke\n    filters:\n    - type: URLRewrite\n      urlRewrite:\n        path:\n          type: ReplaceFullPath\n          replaceFullPath: /\n    backendRefs:\n    - name: ${agent.metadata.name}\n      namespace: ${agent.metadata.namespace}\n      port: 8080\n"
    },
    "resource-config": {
      "title": "1 × ConfigMap — bind Golden to this agent",
      "type": "Checked KRO catalog templates · illustrative, unresolved CEL",
      "text": "WHY: Give the verifier fixed expected identity and URLs for this instance. Do not put a provider key or JWT value in configuration.\n\nWHY THESE RESOURCES EXIST\nGolden ConfigMap: Fixed URLs, expected agent name, owner UID and token file path bind the Job to this instance. It contains no provider key or JWT value. The token is projected at runtime.\n\nSOURCE TEMPLATES\n# KRO template from spec.resources. CEL is resolved by KRO.\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: ${schema.metadata.name}-golden\n  namespace: ${schema.metadata.namespace}\ndata:\n  config.json: '{\"invokeURL\": \"http://classic-demo.classic-agents.svc.cluster.local:8081/classic/classic-agents/${schema.metadata.name}/verify\",\n    \"cardURL\": \"http://classic-demo.classic-agents.svc.cluster.local:8081/classic/classic-agents/${schema.metadata.name}/card\",\n    \"callerURL\": \"http://classic-demo.classic-agents.svc.cluster.local:8080/classic/classic-agents/${schema.metadata.name}/invoke\",\n    \"expectedAgent\": \"${schema.metadata.name}\", \"requestUID\": \"${schema.metadata.uid}\", \"tokenFile\": \"/var/run/golden/token\",\n    \"timeoutSeconds\": 480}'\n"
    },
    "resource-job": {
      "title": "1 × Job — verify before opening caller access",
      "type": "Checked KRO catalog templates · illustrative, unresolved CEL",
      "text": "WHY: Check AgentCard, denied requests and one actual model PONG before KRO creates the caller route. The readiness condition is a creation gate, not continuous reapproval.\n\nRGD dependency: golden.readyWhen includes ${golden.status.succeeded == 1}; callerRoute references ${golden.metadata.name}.\n\nWHY THESE RESOURCES EXIST\nGolden verification Job: After the Agent and verifier routes are ready, the Job checks the card and denied requests, then makes one real model request for PONG. It requires completed native assistant output. backoffLimit is zero.\nCustomer invocation route: The annotation references the Golden Job. KRO waits for that Job to succeed before creating the caller route. A successful Job is a recorded gate, not continuous reapproval or revocation.\n\nSOURCE TEMPLATES\n# KRO template from spec.resources. CEL is resolved by KRO.\napiVersion: batch/v1\nkind: Job\nmetadata:\n  name: ${schema.metadata.name}-golden\n  namespace: ${schema.metadata.namespace}\n  annotations:\n    classic.kagent.dev/agent: ${agent.metadata.name}\n    classic.kagent.dev/route: ${verifyRoute.metadata.name}\n    classic.kagent.dev/card-route: ${cardRoute.metadata.name}\nspec:\n  backoffLimit: 0\n  activeDeadlineSeconds: 600\n  template:\n    metadata:\n      labels:\n        classic.kagent.dev/verifier: ${schema.metadata.name}\n        classic.kagent.dev/request-uid: ${schema.metadata.uid}\n    spec:\n      serviceAccountName: ${verifierAccount.metadata.name}\n      automountServiceAccountToken: false\n      restartPolicy: Never\n      securityContext:\n        runAsNonRoot: true\n        runAsUser: 65532\n        seccompProfile:\n          type: RuntimeDefault\n      containers:\n      - name: golden\n        image: '{{APPROVED_GOLDEN_IMAGE_AT_DIGEST}}'\n        command:\n        - python3\n        - -B\n        - /app/golden.py\n        - --config\n        - /golden/config.json\n        securityContext:\n          readOnlyRootFilesystem: true\n          allowPrivilegeEscalation: false\n          capabilities:\n            drop:\n            - ALL\n        resources:\n          requests:\n            cpu: 25m\n            memory: 32Mi\n          limits:\n            cpu: 500m\n            memory: 128Mi\n        volumeMounts:\n        - name: config\n          mountPath: /golden\n          readOnly: true\n        - name: jwt\n          mountPath: /var/run/golden\n          readOnly: true\n      volumes:\n      - name: config\n        configMap:\n          name: ${goldenConfig.metadata.name}\n      - name: jwt\n        projected:\n          sources:\n          - serviceAccountToken:\n              audience: secure-agent-classic\n              expirationSeconds: 600\n              path: token\n---\n# KRO template from spec.resources. CEL is resolved by KRO.\napiVersion: gateway.networking.k8s.io/v1\nkind: HTTPRoute\nmetadata:\n  name: ${schema.metadata.name}-invoke\n  namespace: ${schema.metadata.namespace}\n  annotations:\n    classic.kagent.dev/policy: ${callerPolicy.metadata.name}\n    classic.kagent.dev/verified-job: ${golden.metadata.name}\nspec:\n  parentRefs:\n  - name: classic-demo\n    namespace: classic-agents\n    sectionName: caller\n  rules:\n  - matches:\n    - path:\n        type: Exact\n        value: /classic/classic-agents/${schema.metadata.name}/invoke\n    filters:\n    - type: URLRewrite\n      urlRewrite:\n        path:\n          type: ReplaceFullPath\n          replaceFullPath: /\n    backendRefs:\n    - name: ${agent.metadata.name}\n      namespace: ${agent.metadata.namespace}\n      port: 8080\n"
    },
    "resource-overview": {
      "title": "14 KRO resources — what each adds",
      "type": "Checked RGD count and purpose · illustration only",
      "text": "KRO CREATES 14 RESOURCES ACROSS 7 KINDS\n1 Agent — system prompt, model, skills and selected MCP tools.\n3 ServiceAccounts — separate runtime, Golden verifier and caller identities.\n2 NetworkPolicies — agent and verifier network boundaries.\n3 AgentgatewayPolicies — JWT authentication and exact-subject authorization.\n3 HTTPRoutes — AgentCard discovery, verification invocation and caller invocation.\n1 ConfigMap — fixed Golden URLs and expected identity; no token value.\n1 Job — Golden checks before the caller route is created.\n\nOWNERSHIP BOUNDARY\nThe shared Gateway, RGD, approved ModelConfig and MCP backends are platform prerequisites, outside these 14 KRO children.\nkagent generates the native Deployment, Service and configuration Secret from the Agent; those are not additional KRO graph nodes.\n\nPROOF BOUNDARY\nThe source graph and templates describe the composition. Recorded 4 Nov proof covers model/caller PONG and JWT checks only. This offline deck performs no live requests and adds no network, MCP or telemetry proof. Entra/UAMI remain desired-state work.\n"
    },
    "hardening-runtime": {
      "title": "Restricted agent and verifier processes",
      "type": "Checked Agent / Job security settings · illustrative templates",
      "text": "WHY: Restrict the process even after a request passes the front door. Agent and Golden run as non-root, disallow privilege escalation, use read-only root filesystems, drop ALL capabilities and set RuntimeDefault seccomp. CPU and memory limits bound both; the agent writable /tmp emptyDir has a 64Mi size limit. These settings are not a sandbox-breakout proof.\n\n# KRO template from spec.resources. CEL is resolved by KRO.\napiVersion: kagent.dev/v1alpha2\nkind: Agent\nmetadata:\n  name: ${schema.metadata.name}\n  namespace: ${schema.metadata.namespace}\nspec:\n  type: Declarative\n  description: KRO-composed native agent without Substrate\n  declarative:\n    runtime: go\n    modelConfig: ${schema.spec.modelConfig}\n    systemMessage: ${schema.spec.systemPrompt}\n    stream: false\n    tools: ${schema.spec.tools.map(id, {\"kubernetes-readonly\":dyn({\"type\":dyn(\"McpServer\"),\"mcpServer\":dyn({\"apiGroup\":dyn(\"kagent.dev\"),\"kind\":dyn(\"RemoteMCPServer\"),\"name\":dyn(\"approved-kubernetes-mcp\"),\"toolNames\":dyn([dyn(\"k8s_get_resources\"),dyn(\"k8s_get_events\")])})}),\"gitlab-readonly\":dyn({\"type\":dyn(\"McpServer\"),\"mcpServer\":dyn({\"apiGroup\":dyn(\"kagent.dev\"),\"kind\":dyn(\"RemoteMCPServer\"),\"name\":dyn(\"approved-gitlab-mcp\"),\"toolNames\":dyn([dyn(\"gitlab_get_project\"),dyn(\"gitlab_get_latest_pipeline\")])})}),\"denodo-readonly\":dyn({\"type\":dyn(\"McpServer\"),\"mcpServer\":dyn({\"apiGroup\":dyn(\"kagent.dev\"),\"kind\":dyn(\"RemoteMCPServer\"),\"name\":dyn(\"approved-denodo-mcp\"),\"toolNames\":dyn([dyn(\"get_inventory_data_product_details\"),dyn(\"get_namespace_count\"),dyn(\"get_namespace_summary\")])})})}[id])}\n    deployment:\n      serviceAccountName: ${runtimeAccount.metadata.name}\n      resources:\n        requests:\n          cpu: 25m\n          memory: 64Mi\n        limits:\n          cpu: 1000m\n          memory: 256Mi\n      env:\n      - name: HOME\n        value: /tmp\n      podSecurityContext:\n        runAsNonRoot: true\n        runAsUser: 1000\n        fsGroup: 1000\n        seccompProfile:\n          type: RuntimeDefault\n      securityContext:\n        allowPrivilegeEscalation: false\n        readOnlyRootFilesystem: true\n        capabilities:\n          drop:\n          - ALL\n      volumes:\n      - name: writable-tmp\n        emptyDir:\n          sizeLimit: 64Mi\n      volumeMounts:\n      - name: writable-tmp\n        mountPath: /tmp\n  skills:\n    gitRefs: ${schema.spec.skills.map(id, {\"work-guidance\":dyn({\"url\":dyn(\"{{APPROVED_GITLAB_SKILLS_REPOSITORY_URL}}\"),\"ref\":dyn(\"{{APPROVED_FULL_COMMIT_ID}}\"),\"path\":dyn(\"skills/work-guidance\"),\"name\":dyn(\"work-guidance\")})}[id])}\n    gitAuthSecretRef:\n      name: approved-git-credentials\n\n---\n# KRO template from spec.resources. CEL is resolved by KRO.\napiVersion: batch/v1\nkind: Job\nmetadata:\n  name: ${schema.metadata.name}-golden\n  namespace: ${schema.metadata.namespace}\n  annotations:\n    classic.kagent.dev/agent: ${agent.metadata.name}\n    classic.kagent.dev/route: ${verifyRoute.metadata.name}\n    classic.kagent.dev/card-route: ${cardRoute.metadata.name}\nspec:\n  backoffLimit: 0\n  activeDeadlineSeconds: 600\n  template:\n    metadata:\n      labels:\n        classic.kagent.dev/verifier: ${schema.metadata.name}\n        classic.kagent.dev/request-uid: ${schema.metadata.uid}\n    spec:\n      serviceAccountName: ${verifierAccount.metadata.name}\n      automountServiceAccountToken: false\n      restartPolicy: Never\n      securityContext:\n        runAsNonRoot: true\n        runAsUser: 65532\n        seccompProfile:\n          type: RuntimeDefault\n      containers:\n      - name: golden\n        image: '{{APPROVED_GOLDEN_IMAGE_AT_DIGEST}}'\n        command:\n        - python3\n        - -B\n        - /app/golden.py\n        - --config\n        - /golden/config.json\n        securityContext:\n          readOnlyRootFilesystem: true\n          allowPrivilegeEscalation: false\n          capabilities:\n            drop:\n            - ALL\n        resources:\n          requests:\n            cpu: 25m\n            memory: 32Mi\n          limits:\n            cpu: 500m\n            memory: 128Mi\n        volumeMounts:\n        - name: config\n          mountPath: /golden\n          readOnly: true\n        - name: jwt\n          mountPath: /var/run/golden\n          readOnly: true\n      volumes:\n      - name: config\n        configMap:\n          name: ${goldenConfig.metadata.name}\n      - name: jwt\n        projected:\n          sources:\n          - serviceAccountToken:\n              audience: secure-agent-classic\n              expirationSeconds: 600\n              path: token\n"
    },
    "hardening-backends": {
      "title": "Approved model and MCP operations — separate backend authority",
      "type": "Checked catalog bindings and design boundary",
      "text": "WHY: Keep agent capability explicit. The Agent references an existing approved ModelConfig, selected skill refs and named operations on approved RemoteMCPServers. The model and MCP backends need their own authentication, authorization, credential handling and transport security. A caller JWT grants access to the agent API; it does not grant Kubernetes, GitLab or database access. The RGD does not create those backend identities or prove successful MCP calls. Entra/UAMI integration remains desired state, not deployed by these templates.\n\n# KRO template from spec.resources. CEL is resolved by KRO.\napiVersion: kagent.dev/v1alpha2\nkind: Agent\nmetadata:\n  name: ${schema.metadata.name}\n  namespace: ${schema.metadata.namespace}\nspec:\n  type: Declarative\n  description: KRO-composed native agent without Substrate\n  declarative:\n    runtime: go\n    modelConfig: ${schema.spec.modelConfig}\n    systemMessage: ${schema.spec.systemPrompt}\n    stream: false\n    tools: ${schema.spec.tools.map(id, {\"kubernetes-readonly\":dyn({\"type\":dyn(\"McpServer\"),\"mcpServer\":dyn({\"apiGroup\":dyn(\"kagent.dev\"),\"kind\":dyn(\"RemoteMCPServer\"),\"name\":dyn(\"approved-kubernetes-mcp\"),\"toolNames\":dyn([dyn(\"k8s_get_resources\"),dyn(\"k8s_get_events\")])})}),\"gitlab-readonly\":dyn({\"type\":dyn(\"McpServer\"),\"mcpServer\":dyn({\"apiGroup\":dyn(\"kagent.dev\"),\"kind\":dyn(\"RemoteMCPServer\"),\"name\":dyn(\"approved-gitlab-mcp\"),\"toolNames\":dyn([dyn(\"gitlab_get_project\"),dyn(\"gitlab_get_latest_pipeline\")])})}),\"denodo-readonly\":dyn({\"type\":dyn(\"McpServer\"),\"mcpServer\":dyn({\"apiGroup\":dyn(\"kagent.dev\"),\"kind\":dyn(\"RemoteMCPServer\"),\"name\":dyn(\"approved-denodo-mcp\"),\"toolNames\":dyn([dyn(\"get_inventory_data_product_details\"),dyn(\"get_namespace_count\"),dyn(\"get_namespace_summary\")])})})}[id])}\n    deployment:\n      serviceAccountName: ${runtimeAccount.metadata.name}\n      resources:\n        requests:\n          cpu: 25m\n          memory: 64Mi\n        limits:\n          cpu: 1000m\n          memory: 256Mi\n      env:\n      - name: HOME\n        value: /tmp\n      podSecurityContext:\n        runAsNonRoot: true\n        runAsUser: 1000\n        fsGroup: 1000\n        seccompProfile:\n          type: RuntimeDefault\n      securityContext:\n        allowPrivilegeEscalation: false\n        readOnlyRootFilesystem: true\n        capabilities:\n          drop:\n          - ALL\n      volumes:\n      - name: writable-tmp\n        emptyDir:\n          sizeLimit: 64Mi\n      volumeMounts:\n      - name: writable-tmp\n        mountPath: /tmp\n  skills:\n    gitRefs: ${schema.spec.skills.map(id, {\"work-guidance\":dyn({\"url\":dyn(\"{{APPROVED_GITLAB_SKILLS_REPOSITORY_URL}}\"),\"ref\":dyn(\"{{APPROVED_FULL_COMMIT_ID}}\"),\"path\":dyn(\"skills/work-guidance\"),\"name\":dyn(\"work-guidance\")})}[id])}\n    gitAuthSecretRef:\n      name: approved-git-credentials\n"
    },
    "api-handoff": {
      "title": "The API returned to the user",
      "type": "Synthetic dashboard handoff · current JWT contract",
      "text": "EXAMPLE PROTECTED GATEWAY ENDPOINT\nhttp://{{GATEWAY_SERVICE_DNS}}:8080/classic/classic-agents/demo/invoke\n\nCURRENT CALLER CONTRACT\nSubject: system:serviceaccount:classic-agents:demo-caller\nAudience: secure-agent-classic\nIssuer: {{KUBERNETES_SERVICE_ACCOUNT_ISSUER}}\nUse a valid short-lived JWT issued for this caller. The page collects and returns no token.\n\nCONSUME IT\nSame-cluster application -> protected Gateway route -> native Agent.\nAn optional VirtualService forwards to this protected path and preserves Authorization, or uses its own separately authorized identity. The native Service is a backend, not a client bypass. Model and MCP permissions remain separate.\n\nTRY THE MOCK IDP\npresentation.html#configure\nFill the form or import its customer YAML. Send runs a local simulation and returns an example API after simulated Golden checks. No cluster or model request is made.\n\nPLANNED ONBOARDING\nLocation and requested IAM / Entra caller identity are separate request metadata. They do not alter the current graph or caller binding. A connected dashboard and custom identity binding require platform-side implementation. The current CR status does not return an endpoint."
    }
  },
  "deckLinks": [
    {
      "label": "Demo home",
      "href": "START-HERE.html"
    },
    {
      "label": "DICE review",
      "href": "showcase.html"

      "href": "resources.html"

    },

<script>
'use strict';
const data=JSON.parse(document.getElementById('deckData').textContent);
const $=id=>document.getElementById(id);
const svgNS='http://www.w3.org/2000/svg';
const mobile=matchMedia('(max-width:899px)');
const reduced=matchMedia('(prefers-reduced-motion:reduce)');
const state={index:0,scenario:new Map(),raf:null,generation:0,effects:[],markers:[],sourceOpener:null,notesOpener:null,printing:false,printScroll:[],repeatMs:0,repeatOverrides:new Map(),repeatTimer:null};
const elements=new Map();
function element(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function svg(tag,attrs){const e=document.createElementNS(svgNS,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);return e}
function color(path){return path.tone==='red'?'var(--accent)':path.reference?'var(--reference)':'var(--link)'}
function buildSlide(slide,index){
 const article=element('article','slide');article.id=slide.id;article.hidden=true;article.inert=true;article.setAttribute('aria-labelledby',slide.id+'-title');article.setAttribute('aria-hidden','true');
 article.append(element('div','accent-rule'),element('div','eyebrow',slide.label));
 const topline=element('div','slide-topline');topline.append(element('span','version','Native kagent · KRO · agentgateway'),element('span','illustration-label','Illustration / synthetic examples'));article.append(topline);
 const heading=element('h1','',slide.title);heading.id=slide.id+'-title';heading.tabIndex=-1;article.append(heading,element('p','intro',slide.intro));
 if(slide.action){const action=element('p','slide-action');const link=element('a','',slide.action.label);link.href=slide.action.href;action.append(link);article.append(action);}
 const content=element('div','content');const interaction=element('div','interaction-row');const scenarioGroup=element('div','scenario-group');scenarioGroup.setAttribute('role','group');scenarioGroup.setAttribute('aria-label','Illustrated scenarios');
 for(const option of slide.scenarios||[]){const button=element('button','scenario','Illustration: '+option.label);button.dataset.scenario=option.id;button.addEventListener('click',()=>{state.scenario.set(slide.id,option.id);applyScenario(slide);play()});scenarioGroup.append(button)}
 interaction.append(scenarioGroup,element('div','diagram-hint','Click a component for source / details'),element('div','print-note','Illustrative architecture. Solid = main flow; dashed = reference or optional path.'));
 content.append(interaction,element('p','mobile-hint','Scroll diagram sideways to explore all components.'));
 const scroller=element('div','diagram-scroll');scroller.tabIndex=0;scroller.setAttribute('role','region');scroller.setAttribute('aria-label',slide.title+' diagram; scroll horizontally on narrow screens');
 const diagram=element('div','diagram');diagram.setAttribute('role','group');diagram.setAttribute('aria-label','Interactive components and labelled connection paths');
 const lines=svg('svg',{class:'connections',viewBox:'0 0 1488 450','aria-hidden':'true'});const defs=svg('defs',{});for(const [tone,fill]of [['blue','var(--link)'],['reference','var(--reference)'],['red','var(--accent)']]){const arrow=svg('marker',{id:slide.id+'-arrow-'+tone,viewBox:'0 0 8 8',refX:7,refY:4,markerWidth:6,markerHeight:6,orient:'auto'});arrow.append(svg('path',{d:'M1 1L7 4L1 7Z',fill}));defs.append(arrow)}lines.append(defs);const pathMap=new Map();
 if(slide.cover){const art=svg('g',{'aria-hidden':'true',class:'cover-orbits'});for(const item of [{"tag":"circle","attrs":{"cx":1010,"cy":225,"r":109,"fill":"none","stroke":"#141414","stroke-opacity":0.075,"stroke-width":1}},{"tag":"circle","attrs":{"cx":1010,"cy":225,"r":128,"fill":"none","stroke":"#e60000","stroke-opacity":0.06,"stroke-width":1}}]){const ring=svg(item.tag,item.attrs);ring.classList.add('cover-halo');art.append(ring)}lines.append(art);}

 for(const p of slide.paths){const line=svg('path',{d:p.d,class:'route'+(p.reference?' reference':'')+(p.tone==='red'?' red':''),'data-path':p.id,'marker-end':'url(#'+slide.id+'-arrow-'+(p.tone==='red'?'red':p.reference?'reference':'blue')+')'});lines.append(line);pathMap.set(p.id,line);if(p.label){const label=svg('text',{x:p.lx,y:p.ly,class:'edge-label'+(p.reference?' reference':'')+(p.tone==='red'?' red':''),'data-label-path':p.id});label.textContent=p.label;lines.append(label)}}
 for(const stop of slide.stops||[]){const g=svg('g',{class:'stop-mark','data-stop-scenario':stop.scenario});g.append(svg('path',{d:`M${stop.x-6} ${stop.y-6}L${stop.x+6} ${stop.y+6}M${stop.x+6} ${stop.y-6}L${stop.x-6} ${stop.y+6}`}));lines.append(g)}
 diagram.append(lines);
 for(const n of slide.nodes){const button=element('button','node '+n.tone+(n.code?' code-node':'')+(n.h<=100?' compact':''));button.dataset.node=n.id;Object.assign(button.style,{left:n.x+'px',top:n.y+'px',width:n.w+'px',height:n.h+'px'});button.setAttribute('aria-label','Inspect '+n.title);const top=element('div','node-top');const icon=svg('svg',{'aria-hidden':'true',viewBox:'0 0 32 32'});icon.append(svg('use',{href:'#icon-'+n.icon}));top.append(icon,element('h2','',n.title));button.append(top,element('p','',n.detail));if(n.code){button.append(element('pre','inline-code',n.code),element('span','inspect-hint','Click to inspect the full synthetic example'))}button.addEventListener('click',()=>openSource(n.source,button));diagram.append(button)}
 if(slide.strips){const strips=element('div','strips');for(const item of slide.strips){const strip=element('div','strip');strip.append(element('strong','',item.title),element('p','',item.text));strips.append(strip)}diagram.append(strips)}
 scroller.append(diagram);content.append(scroller);const legendRow=element('div','legend-row');const legend=element('div','legend');for(const [name,style]of [['Main illustrated flow',''],['Reference / optional','dashed']]){const span=element('span','');span.append(element('i',style),document.createTextNode(name));legend.append(span)}const status=element('div','status','Illustration only. No backend calls or tests run in this deck.');status.setAttribute('aria-live','polite');legendRow.append(legend,status);content.append(legendRow);article.append(content);
 const takeaway=element('div','takeaway');takeaway.append(element('strong','','Takeaway'),element('span','',slide.takeaway));article.append(takeaway);const footer=element('footer','slide-footer');const chapters=element('span','');chapters.append(document.createTextNode('Synthetic architecture · '));for(const chapter of data.deckLinks||[]){const a=element('a','deck-link',chapter.label);a.href=chapter.href;chapters.append(a,document.createTextNode(' · '))}if(!data.deckLinks)chapters.append(document.createTextNode('Native runtime, no Substrate'));footer.append(chapters,element('span','',String(index+1).padStart(2,'0')+' / '+String(data.slides.length).padStart(2,'0')));article.append(footer);$('canvas').append(article);elements.set(slide.id,{article,heading,diagram,lines,pathMap,scenarioGroup,status,scroller});
 if(slide.scenarios)state.scenario.set(slide.id,slide.scenarios[0].id);
}
data.slides.forEach(buildSlide);
for(const [id,source]of Object.entries(data.sources)){const option=element('option','',source.title);option.value=id;$('sourceSelect').append(option)}
function current(){return data.slides[state.index]}
function isActivePath(slide,path){return !path.scenarios||path.scenarios.includes(state.scenario.get(slide.id))}
function applyScenario(slide){const e=elements.get(slide.id);const id=state.scenario.get(slide.id);for(const b of e.scenarioGroup.children)b.setAttribute('aria-pressed',String(b.dataset.scenario===id));for(const path of slide.paths){const active=isActivePath(slide,path);e.pathMap.get(path.id).classList.toggle('inactive',!active);const label=e.lines.querySelector('[data-label-path="'+path.id+'"]');if(label)label.classList.toggle('inactive',!active)}for(const g of e.lines.querySelectorAll('[data-stop-scenario]'))g.classList.toggle('inactive',g.dataset.stopScenario!==id);const scenario=slide.scenarios?.find(s=>s.id===id);e.status.textContent=scenario?scenario.status:'Illustration only. No backend calls or tests run in this deck.'}
function cancelMotion(){clearTimeout(state.repeatTimer);state.repeatTimer=null;state.generation++;if(state.raf!==null)cancelAnimationFrame(state.raf);state.raf=null;for(const effect of state.effects)effect.cancel();state.effects=[];for(const marker of state.markers)marker.remove();state.markers=[];for(const path of document.querySelectorAll('.route')){path.style.strokeDasharray='';path.style.strokeDashoffset=''}}
function canAnimate(){return !reduced.matches&&!document.hidden&&!state.printing&&!$('sourceDialog').open&&!$('notesDialog').open}
function repeatDelay(){return state.repeatOverrides.get(current().id)??current().repeatMs??state.repeatMs}
function scheduleRepeat(){clearTimeout(state.repeatTimer);state.repeatTimer=null;const delay=repeatDelay();if(delay&&canAnimate())state.repeatTimer=setTimeout(play,delay)}
function updateRepeatControl(){$('repeat').disabled=reduced.matches;$('repeat').title=reduced.matches?'Automatic motion is paused by your reduced-motion preference.':'Pause after each flow completes. Repeats the current slide.'}
function duration(token,fallback){const raw=getComputedStyle(document.documentElement).getPropertyValue(token).trim();return raw.endsWith('ms')?Number.parseFloat(raw):raw.endsWith('s')?Number.parseFloat(raw)*1000:fallback}
function play(){cancelMotion();const slide=current();const e=elements.get(slide.id);applyScenario(slide);if(!canAnimate())return;const generation=state.generation;const enter=duration('--enter-duration',450);const packet=slide.packetDuration??duration('--packet-duration',850);const paths=slide.paths.filter(p=>isActivePath(slide,p));for(const [i,node]of Array.from(e.diagram.querySelectorAll('.node')).filter(()=>!slide.cover).entries()){state.effects.push(node.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'translateY(0)'}],{duration:enter,delay:i*90,easing:'cubic-bezier(.2,.65,.3,1)',fill:'backwards'}))}
 if(slide.cover){for(const ring of e.lines.querySelectorAll('.cover-halo'))state.effects.push(ring.animate([{opacity:.35},{opacity:1},{opacity:.35}],{duration:1300,iterations:2,fill:'none',easing:'ease-in-out'}));}
 const travels=paths.map((path,i)=>{const line=e.pathMap.get(path.id);const length=line.getTotalLength();const marker=svg('circle',{r:6,fill:color(path),class:'packet',opacity:0,'data-reference':String(path.reference)});e.lines.append(marker);state.markers.push(marker);return {path,line,length,marker,start:330+i*170}});const start=performance.now();const end=Math.max(enter+slide.nodes.length*90,...travels.map(t=>t.start+packet))+80;
 function tick(now){if(generation!==state.generation)return;const elapsed=now-start;for(const t of travels){const p=Math.max(0,Math.min(1,(elapsed-t.start)/packet));if(!t.path.reference){t.line.style.strokeDasharray=t.length+' '+t.length;t.line.style.strokeDashoffset=String(t.length*(1-p))}t.marker.setAttribute('opacity',elapsed>=t.start&&p<1?'1':'0');const point=t.line.getPointAtLength(t.length*p);t.marker.setAttribute('cx',point.x);t.marker.setAttribute('cy',point.y)}if(elapsed<end)state.raf=requestAnimationFrame(tick);else{cancelMotion();e.status.textContent=(slide.scenarios?.find(s=>s.id===state.scenario.get(slide.id))?.status||'Illustration complete. Inspect a component or replay the flow.')+' No live result is represented.';scheduleRepeat()}}
 state.raf=requestAnimationFrame(tick);
}
function fit(){if(mobile.matches){$('stage').style.width='';$('stage').style.height='';document.documentElement.style.setProperty('--scale','1');return}const scale=Math.min((innerWidth-48)/1600,(innerHeight-118)/900);document.documentElement.style.setProperty('--scale',String(scale));$('stage').style.width=1600*scale+'px';$('stage').style.height=900*scale+'px'}
function showSlide(index,{animate=true,hash=true,focus=false}={}){cancelMotion();state.index=Math.max(0,Math.min(data.slides.length-1,index));const slide=current();for(const entry of data.slides){const active=entry.id===slide.id;const article=elements.get(entry.id).article;article.hidden=!active;article.inert=!active;article.setAttribute('aria-hidden',String(!active))}applyScenario(slide);$('repeat').value=String(repeatDelay());$('previous').disabled=state.index===0;$('next').disabled=state.index===data.slides.length-1;$('slideCounter').textContent=(state.index+1)+' / '+data.slides.length;$('slideAnnouncement').textContent='Slide '+(state.index+1)+' of '+data.slides.length+'. '+slide.title;if(hash&&location.hash!=='#'+slide.id)location.hash=slide.id;if(focus)elements.get(slide.id).heading.focus({preventScroll:true});if(mobile.matches)window.scrollTo({top:0,behavior:'instant'});fit();if(animate)play();else scheduleRepeat()}
function sourceText(){const source=data.sources[$('sourceSelect').value];$('sourceCode').textContent=source.text;$('sourceMeta').textContent=source.type+' · Illustration only';$('sourceCode').scrollTop=0;$('sourceCode').scrollLeft=0;$('copyStatus').textContent=''}
function openSource(id,opener){cancelMotion();state.sourceOpener=opener||document.activeElement;$('sourceSelect').value=id;sourceText();$('sourceDialog').showModal();$('sourceSelect').focus()}
function openNotes(opener){cancelMotion();state.notesOpener=opener||document.activeElement;$('notesTitle').textContent='Slide '+(state.index+1)+' / Presenter notes';$('notesText').textContent=current().notes;$('notesDialog').showModal();$('closeNotes').focus()}
$('sourceSelect').addEventListener('change',sourceText);$('sourceDialog').addEventListener('close',()=>{if(state.sourceOpener?.isConnected)state.sourceOpener.focus({preventScroll:true});scheduleRepeat()});$('notesDialog').addEventListener('close',()=>{if(state.notesOpener?.isConnected)state.notesOpener.focus({preventScroll:true});scheduleRepeat()});$('closeSource').addEventListener('click',()=>$('sourceDialog').close());$('closeNotes').addEventListener('click',()=>$('notesDialog').close());
$('copySource').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('sourceCode').textContent);$('copyStatus').textContent='Copied source text.'}catch{const range=document.createRange();range.selectNodeContents($('sourceCode'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);$('sourceCode').focus();$('copyStatus').textContent='Clipboard unavailable. Text selected; press Cmd+C or Ctrl+C to copy manually.'}});
$('repeat').addEventListener('change',()=>{const delay=Number($('repeat').value);if(current().repeatMs!==undefined)state.repeatOverrides.set(current().id,delay);else state.repeatMs=delay;cancelMotion();if(delay)play()});
$('previous').addEventListener('click',()=>showSlide(state.index-1));$('next').addEventListener('click',()=>showSlide(state.index+1));$('replay').addEventListener('click',play);$('notes').addEventListener('click',event=>openNotes(event.currentTarget));$('details').addEventListener('click',event=>openSource(current().nodes[0].source,event.currentTarget));$('print').addEventListener('click',()=>{cancelMotion();window.print()});
document.addEventListener('keydown',event=>{if(event.ctrlKey||event.metaKey||event.altKey||event.target.closest('input,textarea,select,[contenteditable],dialog')||$('sourceDialog').open||$('notesDialog').open||window.getSelection()?.toString())return;const key=event.key.toLowerCase();if(event.shiftKey&&key.startsWith('arrow'))return;let target=null;if(['arrowright','pagedown'].includes(key))target=state.index+1;if(['arrowleft','pageup'].includes(key))target=state.index-1;if(key==='home')target=0;if(key==='end')target=data.slides.length-1;if(target!==null){event.preventDefault();showSlide(target,{focus:true})}else if(key==='r'){event.preventDefault();play()}else if(key==='n'){event.preventDefault();openNotes(event.target)}});
window.addEventListener('hashchange',()=>{const index=data.slides.findIndex(s=>'#'+s.id===location.hash);if(index>=0&&index!==state.index)showSlide(index,{hash:false})});window.addEventListener('resize',()=>{cancelMotion();fit();scheduleRepeat()});document.addEventListener('visibilitychange',()=>{cancelMotion();scheduleRepeat()});reduced.addEventListener('change',()=>{cancelMotion();updateRepeatControl();scheduleRepeat()});
window.addEventListener('beforeprint',()=>{cancelMotion();state.printing=true;state.printScroll=Array.from(document.querySelectorAll('.diagram-scroll,.source-code'),e=>({e,left:e.scrollLeft,top:e.scrollTop}));for(const item of state.printScroll){item.e.scrollLeft=0;item.e.scrollTop=0}for(const entry of elements.values()){entry.article.hidden=false;entry.article.inert=true}});
window.addEventListener('afterprint',()=>{state.printing=false;showSlide(state.index,{animate:false,hash:false});for(const item of state.printScroll){item.e.scrollLeft=item.left;item.e.scrollTop=item.top}state.printScroll=[]});
updateRepeatControl();
const initial=data.slides.findIndex(s=>'#'+s.id===location.hash);showSlide(initial>=0?initial:0,{animate:data.slides[initial>=0?initial:0].cover===true});
</script>
