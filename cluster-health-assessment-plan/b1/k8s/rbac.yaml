apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-health-assessor
  namespace: cluster-health-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-health-metrics
  namespace: cluster-health-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-health-assessor-cluster-read
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - nonResourceURLs: ["/readyz", "/readyz/*"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-health-assessor-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-health-assessor-cluster-read
subjects:
  - kind: ServiceAccount
    name: cluster-health-assessor
    namespace: cluster-health-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-health-metrics-read
  namespace: cluster-health-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-health-metrics-read
  namespace: cluster-health-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-health-metrics-read
subjects:
  - kind: ServiceAccount
    name: cluster-health-metrics
    namespace: cluster-health-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-health-assessor-namespace-read
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["fox-autonomous-monitor-state"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-health-assessor-state
  namespace: cluster-health-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-health-assessor-state
  namespace: cluster-health-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-health-assessor-state
subjects:
  - kind: ServiceAccount
    name: cluster-health-assessor
    namespace: cluster-health-system
