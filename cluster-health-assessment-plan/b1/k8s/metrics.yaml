apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-health-metrics
  namespace: cluster-health-system
  labels:
    app.kubernetes.io/name: cluster-health-assessment
    app.kubernetes.io/component: metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-health-assessment
      app.kubernetes.io/component: metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-health-assessment
        app.kubernetes.io/component: metrics
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: cluster-health-metrics
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: metrics
          image: python:3.11-slim@sha256:d1053354624536b044162aaab1e418bd000ea35184fb1ae098ab3166b1072e72
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/metrics.py"]
          envFrom:
            - configMapRef:
                name: cluster-health-config
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: metrics
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scripts
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: cluster-health-scripts
            defaultMode: 0555
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-health-metrics
  namespace: cluster-health-system
  labels:
    app.kubernetes.io/name: cluster-health-assessment
    app.kubernetes.io/component: metrics
spec:
  selector:
    app.kubernetes.io/name: cluster-health-assessment
    app.kubernetes.io/component: metrics
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cluster-health-assessment
  namespace: cluster-health-system
  labels:
    app.kubernetes.io/name: cluster-health-assessment
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-health-assessment
      app.kubernetes.io/component: metrics
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
