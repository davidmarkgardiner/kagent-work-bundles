apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-health-snapshot
  namespace: cluster-health-system
  labels:
    app.kubernetes.io/name: cluster-health-assessment
    app.kubernetes.io/component: collector
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 240
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 240
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cluster-health-assessment
            app.kubernetes.io/component: collector
        spec:
          serviceAccountName: cluster-health-assessor
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: collector
              image: python:3.11-slim@sha256:d1053354624536b044162aaab1e418bd000ea35184fb1ae098ab3166b1072e72
              imagePullPolicy: IfNotPresent
              command: ["python", "/app/collector.py"]
              envFrom:
                - configMapRef:
                    name: cluster-health-config
              env:
                - name: MODE
                  value: snapshot
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                  ephemeral-storage: 16Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
                  ephemeral-storage: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: scripts
                  mountPath: /app
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: cluster-health-scripts
                defaultMode: 0555
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
