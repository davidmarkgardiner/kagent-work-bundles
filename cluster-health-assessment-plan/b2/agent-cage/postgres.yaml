apiVersion: v1
kind: Service
metadata:
  name: cluster-health-postgres
  namespace: agent-health-system
  labels:
    app.kubernetes.io/name: cluster-health-postgres
spec:
  selector:
    app.kubernetes.io/name: cluster-health-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cluster-health-postgres
  namespace: agent-health-system
spec:
  serviceName: cluster-health-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-health-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-health-postgres
        app.kubernetes.io/component: state
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cluster-health-postgres-auth
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cluster-health-postgres-auth
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: cluster-health-postgres-auth
                  key: database
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cluster-health-postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cluster-health-postgres
  namespace: agent-health-system
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
