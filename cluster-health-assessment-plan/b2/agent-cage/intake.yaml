apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-health-intake
  namespace: agent-health-system
  labels:
    app.kubernetes.io/name: cluster-health-intake
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-health-intake
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-health-intake
        app.kubernetes.io/component: intake
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: intake
          image: cluster-health-intake:b2-20260915
          imagePullPolicy: Never
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: cluster-health-postgres-auth
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: cluster-health-postgres-auth
                  key: password
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: cluster-health-postgres-auth
                  key: database
            - name: PGHOST
              value: cluster-health-postgres.agent-health-system.svc
            - name: HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: cluster-health-intake-auth
                  key: hmac-secret
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cluster-health-intake-auth
                  key: internal-token
            - name: ALLOWED_CLUSTER_GENERATIONS
              value: homelab-worker-red=homelab-b1-g1
            - name: TLS_CERT_FILE
              value: /tls/tls.crt
            - name: TLS_KEY_FILE
              value: /tls/tls.key
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: cluster-health-intake-tls
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-health-intake
  namespace: agent-health-system
  labels:
    app.kubernetes.io/name: cluster-health-intake
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: cluster-health-intake
  ports:
    - name: https
      port: 8443
      targetPort: https
      nodePort: 30443
