apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-health-summary-reconciler
  namespace: agent-health-system
spec:
  schedule: "6-59/5 * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 60
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cluster-health-summary-reconciler
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconciler
              image: python:3.11-slim@sha256:d1053354624536b044162aaab1e418bd000ea35184fb1ae098ab3166b1072e72
              command: ["python", "/app/reconciler.py"]
              env:
                - name: CLUSTER_ID
                  value: homelab-worker-red
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              resources:
                requests:
                  cpu: 5m
                  memory: 24Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: auth
                  mountPath: /auth
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: cluster-health-summary-reconciler-script
            - name: auth
              projected:
                sources:
                  - secret:
                      name: cluster-health-intake-auth
                      items:
                        - key: internal-token
                          path: internal-token
                  - secret:
                      name: cluster-health-ca
                      items:
                        - key: ca.crt
                          path: ca.crt
            - name: tmp
              emptyDir:
                sizeLimit: 8Mi
