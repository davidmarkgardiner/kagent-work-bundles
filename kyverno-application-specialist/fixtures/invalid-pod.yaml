apiVersion: v1
kind: Pod
metadata:
  name: invalid-pod
  namespace: kyverno-recovery-demo
  labels:
    app.kubernetes.io/name: registry-demo
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: web
    image: unapproved.example.invalid/library/busybox:1.36
    command:
    - sh
    - -c
    - mkdir -p /tmp/www && echo recovered > /tmp/www/index.html && exec httpd -f -p
      8080 -h /tmp/www
    ports:
    - containerPort: 8080
    resources:
      requests:
        cpu: 10m
        memory: 8Mi
      limits:
        cpu: 100m
        memory: 32Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    volumeMounts:
    - name: temporary
      mountPath: /tmp
    readinessProbe:
      httpGet:
        path: /
        port: 8080
      periodSeconds: 2
  volumes:
  - name: temporary
    emptyDir: {}
