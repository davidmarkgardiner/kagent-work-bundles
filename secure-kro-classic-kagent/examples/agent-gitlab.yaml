# Workplace adapter example. Resolve the catalog and verify actual skill/tool execution.
apiVersion: demo.kagent.dev/v1alpha1
kind: ClassicSecureAgent
metadata:
  name: demo
  namespace: classic-agents
spec:
  modelConfig: approved-model
  systemPrompt: Use the configured GitLab project tools to report its default branch and latest
    pipeline. Do not create or modify issues, branches, commits, merge requests or pipelines.
    When asked for PONG, reply with exactly PONG without calling tools.
  skills:
  - work-guidance
  tools:
  - gitlab-readonly
