# Sanitized native controller output recorded 2026-11-04. Not a file to apply.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: classic-agents
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: kagent
      kagent: demo
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kagent.dev/config-hash: '8117045136914952335'
      labels:
        app: kagent
        app.kubernetes.io/managed-by: kagent
        app.kubernetes.io/name: demo
        app.kubernetes.io/part-of: kagent
        kagent: demo
    spec:
      containers:
      - args:
        - --host
        - 0.0.0.0
        - --port
        - '8080'
        - --filepath
        - /config
        env:
        - name: HOME
          value: /tmp
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              key: api-key
              name: classic-model-token
        - name: OTEL_LOGGING_ENABLED
          value: 'false'
        - name: OTEL_TRACING_ENABLED
          value: 'false'
        - name: KAGENT_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: KAGENT_NAME
          value: demo
        - name: KAGENT_URL
          value: http://classic-controller.classic-system:8083
        image: ghcr.io/kagent-dev/kagent/golang-adk:0.10.4
        imagePullPolicy: IfNotPresent
        name: kagent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /.well-known/agent-card.json
            port: http
            scheme: HTTP
          initialDelaySeconds: 1
          periodSeconds: 1
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '1'
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /config
          name: config
        - mountPath: /tmp
          name: writable-tmp
        - mountPath: /var/run/secrets/tokens
          name: kagent-token
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: demo-runtime
      serviceAccountName: demo-runtime
      terminationGracePeriodSeconds: 30
      volumes:
      - name: config
        secret:
          defaultMode: 420
          secretName: demo
      - emptyDir:
          sizeLimit: 64Mi
        name: writable-tmp
      - name: kagent-token
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              audience: kagent
              expirationSeconds: 3600
              path: kagent-token
