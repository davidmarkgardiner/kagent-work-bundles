apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-dab-poc-seed
  namespace: postgres-dab-mcp-poc
  labels:
    app.kubernetes.io/part-of: postgres-dab-sql-mcp-poc
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: seed
          image: pgvector/pgvector:0.8.6-pg17-bookworm
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-dab-poc-admin
                  key: credential
            - name: DAB_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-dab-poc-reader
                  key: credential
          command: ["sh", "-ec"]
          args:
            - |
              until pg_isready -h postgres-dab-poc -U postgres -d governed_data; do sleep 2; done
              psql -v ON_ERROR_STOP=1 -h postgres-dab-poc -U postgres -d governed_data <<'SQL'
              CREATE EXTENSION IF NOT EXISTS vector;
              DROP VIEW IF EXISTS public.v_namespace_image_summary;
              DROP TABLE IF EXISTS public.container_image_inventory;
              DROP TABLE IF EXISTS public.kubernetes_namespace_inventory;
              CREATE TABLE public.kubernetes_namespace_inventory (
                namespace_name text PRIMARY KEY,
                environment text NOT NULL CHECK (environment IN ('development', 'test', 'production')),
                owner_team text NOT NULL,
                workload_count integer NOT NULL CHECK (workload_count >= 0),
                running_pod_count integer NOT NULL CHECK (running_pod_count >= 0),
                observed_at date NOT NULL
              );
              CREATE TABLE public.container_image_inventory (
                image_id integer PRIMARY KEY,
                namespace_name text NOT NULL REFERENCES public.kubernetes_namespace_inventory(namespace_name),
                workload_name text NOT NULL,
                image_repository text NOT NULL,
                image_tag text NOT NULL,
                image_digest text NOT NULL,
                critical_findings integer NOT NULL CHECK (critical_findings >= 0),
                high_findings integer NOT NULL CHECK (high_findings >= 0),
                scanned_at date NOT NULL,
                embedding vector(3) NOT NULL
              );
              INSERT INTO public.kubernetes_namespace_inventory VALUES
                ('payments', 'production', 'payments-platform', 4, 12, DATE '2026-08-13'),
                ('catalogue', 'production', 'commerce-platform', 3, 8, DATE '2026-08-13'),
                ('developer-tools', 'development', 'platform-engineering', 5, 10, DATE '2026-08-13');
              INSERT INTO public.container_image_inventory VALUES
                (101, 'payments', 'payments-api', 'registry.example.invalid/payments-api', '2.4.1', 'sha256:synthetic-payments-api', 0, 2, DATE '2026-08-12', '[0.98,0.02,0.01]'),
                (102, 'payments', 'payments-worker', 'registry.example.invalid/payments-worker', '1.9.0', 'sha256:synthetic-payments-worker', 1, 3, DATE '2026-08-12', '[0.10,0.91,0.03]'),
                (103, 'catalogue', 'catalogue-api', 'registry.example.invalid/catalogue-api', '3.1.2', 'sha256:synthetic-catalogue-api', 0, 0, DATE '2026-08-11', '[0.05,0.09,0.92]'),
                (104, 'developer-tools', 'build-runner', 'registry.example.invalid/build-runner', '0.7.4', 'sha256:synthetic-build-runner', 0, 1, DATE '2026-08-13', '[0.20,0.30,0.50]');
              CREATE INDEX container_image_inventory_embedding_hnsw
                ON public.container_image_inventory USING hnsw (embedding vector_cosine_ops);
              CREATE VIEW public.v_namespace_image_summary AS
                SELECT n.namespace_name,
                  n.environment,
                  n.owner_team,
                  n.workload_count,
                  n.running_pod_count,
                  n.observed_at AS namespace_observed_at,
                  i.workload_name,
                  i.image_repository,
                  i.image_tag,
                  i.image_digest,
                  i.critical_findings,
                  i.high_findings,
                  i.scanned_at
                FROM public.kubernetes_namespace_inventory n
                JOIN public.container_image_inventory i USING (namespace_name);
              SQL
              if ! psql -At -h postgres-dab-poc -U postgres -d governed_data \
                   -c "SELECT 1 FROM pg_roles WHERE rolname = 'dab_reader'" | grep -qx 1; then
                psql -v ON_ERROR_STOP=1 -h postgres-dab-poc -U postgres -d governed_data \
                  -c "CREATE ROLE dab_reader LOGIN PASSWORD '$DAB_READER_PASSWORD'";
              else
                psql -v ON_ERROR_STOP=1 -h postgres-dab-poc -U postgres -d governed_data \
                  -c "ALTER ROLE dab_reader PASSWORD '$DAB_READER_PASSWORD'";
              fi
              psql -v ON_ERROR_STOP=1 -h postgres-dab-poc -U postgres -d governed_data <<'SQL'
              REVOKE ALL ON SCHEMA public FROM PUBLIC;
              GRANT USAGE ON SCHEMA public TO dab_reader;
              GRANT SELECT ON public.v_namespace_image_summary TO dab_reader;
              SQL
