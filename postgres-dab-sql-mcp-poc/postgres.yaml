apiVersion: v1
kind: Namespace
metadata:
  name: postgres-dab-mcp-poc
  labels:
    app.kubernetes.io/part-of: postgres-dab-sql-mcp-poc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-dab-poc
  namespace: postgres-dab-mcp-poc
spec:
  selector:
    app.kubernetes.io/name: postgres-dab-poc
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-dab-poc
  namespace: postgres-dab-mcp-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-dab-poc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-dab-poc
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.6-pg17-bookworm
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: governed_data
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-dab-poc-admin
                  key: credential
          readinessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U postgres -d governed_data"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
