# HomeLab-only runtime proof. It verifies the actual kagent SkillsTool path
# against the committed public Git ref. Work uses the digest-pinned skill image
# in work-lift-and-shift/postgres-inventory-data-contract-skill/ instead.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: mcpg-data-contract-skill-gitref-spike-agent
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: postgres-dab-sql-mcp-poc
    example.kagent.dev/scope: lab-only
spec:
  type: Declarative
  description: HomeLab proof of a Git-backed PostgreSQL inventory data-contract skill with MCPg.
  skills:
    # skills-init is a Go binary. Under the enforced numeric pod UID it needs
    # USER set so os/user.Current() does not require a passwd entry.
    initContainer:
      env:
        - name: USER
          value: kagent
    gitRefs:
      - name: postgres-inventory-data-contract
        url: https://github.com/davidmarkgardiner/kagent-public.git
        ref: feat/aks-fleet-azure-policy
        path: work-agent-bundles/postgres-dab-sql-mcp-poc/work-lift-and-shift/postgres-inventory-data-contract-skill/skill
  declarative:
    runtime: python
    modelConfig: agentgateway-minimax
    deployment:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65532 # kagent v0.10 distroless runtime's numeric non-root UID.
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: false # Verify controller-runtime compatibility before tightening.
    systemMessage: |
      Use the loaded PostgreSQL inventory data-contract skill and only the
      mounted MCPg read-only tools. This is a synthetic HomeLab fixture only:
      public.v_namespace_image_summary is the approved namespace-inventory
      view. For the namespace-count question, use run_select to count distinct
      namespace_name values from that view. Never write, modify schema, request
      credentials, or claim access to real data. Begin the final answer with
      MCPG_SKILL_RUNTIME_REPLY_OK and use the skill's standard response format.
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: mcpg-readonly-spike
          namespace: kagent
          toolNames:
            - list_tables
            - describe_table
            - run_select
