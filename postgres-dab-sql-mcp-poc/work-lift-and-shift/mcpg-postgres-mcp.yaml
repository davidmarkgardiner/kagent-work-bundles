# MCPg v0.7.1 work template. Render values only in a private overlay; never
# commit the database endpoint, connection string, password, or registry auth.
apiVersion: v1
kind: Service
metadata:
  name: postgres-inventory-mcp
  namespace: "{{DATA_MCP_NAMESPACE}}"
  labels:
    app.kubernetes.io/name: postgres-inventory-mcp
    app.kubernetes.io/part-of: postgres-data-mcp
spec:
  selector:
    app.kubernetes.io/name: postgres-inventory-mcp
  ports:
    - name: mcp
      port: 8000
      targetPort: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-inventory-mcp
  namespace: "{{DATA_MCP_NAMESPACE}}"
  labels:
    app.kubernetes.io/name: postgres-inventory-mcp
    app.kubernetes.io/part-of: postgres-data-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-inventory-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-inventory-mcp
    spec:
      # Password bootstrap only. Do not enable a projected service-account
      # token until a separate Entra/UAMI path is tested for MCPg.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcpg
          image: "{{INTERNAL_REGISTRY}}/third-party/mcpg@sha256:{{IMAGE_DIGEST}}"
          imagePullPolicy: IfNotPresent
          # MCPg v0.7.1 is configured with MCPG_* environment variables.
          # Do not add CrystalDBA arguments such as --access-mode=restricted.
          env:
            - name: MCPG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: "{{POSTGRES_MCP_SECRET_NAME}}"
                  key: postgres-url
            - name: MCPG_ACCESS_MODE
              value: read-only
            - name: MCPG_TRANSPORT
              value: streamable-http
            - name: MCPG_HTTP_HOST
              value: 0.0.0.0
            - name: MCPG_HTTP_PORT
              value: "8000"
            - name: MCPG_ENABLE_ANALYTICAL_QUERIES
              value: "false"
            - name: MCPG_STATEMENT_TIMEOUT_MS
              value: "10000"
            - name: MCPG_LOCK_TIMEOUT_MS
              value: "3000"
            - name: MCPG_LOG_LEVEL
              value: WARNING
          ports:
            - name: mcp
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 20
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false # MCPg image compatibility to validate in work.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
