# MCPg first-stage Agent. It is intentionally schema-only: do not add a
# generic SQL/query Agent until approved views, data classification, and
# model-egress controls have passed review.
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: postgres-inventory-mcpg
  namespace: "{{KAGENT_NAMESPACE}}"
spec:
  description: MCPg v0.7.1 read-only PostgreSQL schema discovery via Agent Gateway.
  protocol: STREAMABLE_HTTP
  url: "http://{{AGENTGATEWAY_SERVICE}}.{{AGENTGATEWAY_NAMESPACE}}.svc.cluster.local/mcp/postgres-inventory"
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: postgres-inventory-schema-agent
  namespace: "{{KAGENT_NAMESPACE}}"
spec:
  type: Declarative
  description: Read-only MCPg schema agent for the approved PostgreSQL inventory product.
  declarative:
    runtime: python
    modelConfig: "{{KAGENT_MODEL_CONFIG}}"
    deployment:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: false # Verify controller-runtime compatibility before tightening.
    systemMessage: |
      Inspect only the approved PostgreSQL schema through the three mounted MCPg
      metadata tools. Never request credentials, query rows, generate SQL,
      write, or claim access beyond returned metadata. Return concise facts.
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: postgres-inventory-mcpg
          namespace: "{{KAGENT_NAMESPACE}}"
          toolNames:
            - list_schemas
            - list_tables
            - describe_table
