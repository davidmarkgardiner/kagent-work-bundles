# Apply this rendered replacement policy after the parent schema-only profile.
# It keeps the same route, rate limit, and timeout while adding only run_select.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: postgres-inventory-mcp
  namespace: "{{AGENTGATEWAY_NAMESPACE}}"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: postgres-inventory-mcp
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
            - >-
              mcp.tool.name in [
                "list_schemas",
                "list_tables",
                "describe_table",
                "run_select"
              ]
  traffic:
    rateLimit:
      local:
        - requests: 60
          unit: Minutes
          burst: 20
    timeouts:
      request: "60s"
