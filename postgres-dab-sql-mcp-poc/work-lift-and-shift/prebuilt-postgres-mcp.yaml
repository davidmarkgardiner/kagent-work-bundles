# TEMPLATE ONLY. Render placeholders in a private work overlay; never commit
# connection strings, passwords, hosts, or registry credentials.
apiVersion: v1
kind: Service
metadata:
  name: postgres-inventory-mcp
  namespace: "{{DATA_MCP_NAMESPACE}}"
  labels:
    app.kubernetes.io/name: postgres-inventory-mcp
    app.kubernetes.io/part-of: postgres-data-mcp
spec:
  selector:
    app.kubernetes.io/name: postgres-inventory-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-inventory-mcp
  namespace: "{{DATA_MCP_NAMESPACE}}"
  labels:
    app.kubernetes.io/name: postgres-inventory-mcp
    app.kubernetes.io/part-of: postgres-data-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-inventory-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-inventory-mcp
    spec:
      # Password-bootstrap mode. Change only after the UAMI/Entra token path is
      # independently live-proven for this selected MCP image.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres-mcp
          # Same repository and runtime arguments as the HomeLab/Azure POC:
          # crystaldba/postgres-mcp:latest. Resolve that tested source to an
          # immutable digest, scan/sign it, then mirror this exact image path.
          image: "{{INTERNAL_REGISTRY}}/third-party/crystaldba/postgres-mcp@{{IMAGE_DIGEST}}"
          imagePullPolicy: IfNotPresent
          args: ["--access-mode=restricted", "--transport=sse"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false # Image runtime needs validation before tightening.
          env:
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: "{{POSTGRES_MCP_SECRET_NAME}}"
                  key: postgres-url
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            # Transport-only: this does not validate a PostgreSQL login or a
            # query. The direct discovery and final approved query gates do.
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
