# Lab-only POC. It has no Kubernetes RBAC. The approval run can only call the
# fixed read-only kagent PRD A2A endpoint and uses the existing lab gateway key.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maf-harness-poc-state
  namespace: kagent
  labels: {app.kubernetes.io/part-of: maf-harness-poc}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 64Mi}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maf-harness-poc
  namespace: kagent
  labels: {app.kubernetes.io/part-of: maf-harness-poc}
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: maf-harness-request
  namespace: kagent
  labels: {app.kubernetes.io/part-of: maf-harness-poc, maf-poc-stage: request}
spec:
  backoffLimit: 0
  template:
    metadata: {labels: {app.kubernetes.io/part-of: maf-harness-poc}}
    spec:
      restartPolicy: Never
      serviceAccountName: maf-harness-poc
      securityContext: {fsGroup: 65532}
      containers:
        - name: harness
          image: python:3.12-slim
          command: [sh, -ec]
          args: ["pip install --no-cache-dir --target /tmp/python -r /app/requirements.txt && PYTHONPATH=/tmp/python python /app/run.py"]
          env: [{name: MODE, value: request}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
            - {name: state, mountPath: /state}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: app, configMap: {name: maf-harness-poc-app}}
        - {name: state, persistentVolumeClaim: {claimName: maf-harness-poc-state}}
        - {name: tmp, emptyDir: {}}
