# This Job may run only after the recorded approval phase. The Harness Agent is
# given one tool: a bounded factory handoff which calls the five tool-free A2A
# specialists in order and persists all stage receipts to the existing PVC.
apiVersion: batch/v1
kind: Job
metadata:
  name: maf-harness-sdlc-factory
  namespace: kagent
  labels: {app.kubernetes.io/part-of: maf-harness-poc, maf-poc-stage: factory}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata: {labels: {app.kubernetes.io/part-of: maf-harness-poc}}
    spec:
      restartPolicy: Never
      serviceAccountName: maf-harness-poc
      securityContext: {fsGroup: 65532}
      containers:
        - name: harness
          image: python:3.12-slim
          command: [sh, -ec]
          args: ["pip install --no-cache-dir --target /tmp/python -r /app/requirements.txt && PYTHONPATH=/tmp/python python /app/run.py"]
          env:
            - {name: MODE, value: factory}
            - {name: HOME, value: /state}
            - {name: MODEL, value: kimi-for-coding}
            - {name: OPENAI_BASE_URL, value: http://ai-gateway.agentgateway-system.svc.cluster.local/kimi/v1}
            - {name: KAGENT_A2A_BASE_URL, value: http://kagent-controller.kagent.svc.cluster.local:8083/api/a2a/kagent}
            - name: OPENAI_API_KEY
              valueFrom: {secretKeyRef: {name: agentgateway-qwen-key, key: api-key}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
            - {name: state, mountPath: /state}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: app, configMap: {name: maf-harness-poc-app}}
        - {name: state, persistentVolumeClaim: {claimName: maf-harness-poc-state}}
        - {name: tmp, emptyDir: {}}
