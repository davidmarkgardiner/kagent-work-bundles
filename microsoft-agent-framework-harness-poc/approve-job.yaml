# Applying this manifest is the explicit lab-operator approval action.
apiVersion: batch/v1
kind: Job
metadata:
  name: maf-harness-approve
  namespace: kagent
  labels: {app.kubernetes.io/part-of: maf-harness-poc, maf-poc-stage: approved}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  template:
    metadata: {labels: {app.kubernetes.io/part-of: maf-harness-poc}}
    spec:
      restartPolicy: Never
      serviceAccountName: maf-harness-poc
      securityContext: {fsGroup: 65532}
      containers:
        - name: harness
          image: python:3.12-slim
          command: [sh, -ec]
          args: ["pip install --no-cache-dir --target /tmp/python -r /app/requirements.txt && PYTHONPATH=/tmp/python python /app/run.py"]
          env:
            - {name: MODE, value: approve}
            - {name: HOME, value: /state}
            - {name: MODEL, value: kimi-for-coding}
            - {name: OPENAI_BASE_URL, value: http://ai-gateway.agentgateway-system.svc.cluster.local/kimi/v1}
            - {name: KAGENT_A2A_URL, value: http://kagent-controller.kagent.svc.cluster.local:8083/api/a2a/kagent/debt-a2a-prd/}
            - name: OPENAI_API_KEY
              valueFrom: {secretKeyRef: {name: agentgateway-qwen-key, key: api-key}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
            - {name: state, mountPath: /state}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: app, configMap: {name: maf-harness-poc-app}}
        - {name: state, persistentVolumeClaim: {claimName: maf-harness-poc-state}}
        - {name: tmp, emptyDir: {}}
