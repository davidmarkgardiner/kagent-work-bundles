apiVersion: batch/v1
kind: Job
metadata:
  name: trino-data-mcp-seed
  namespace: data-mcp-poc
  labels:
    app.kubernetes.io/part-of: starburst-trino-data-mcp-poc
spec:
  backoffLimit: 0
  # Retain the initialisation receipt for the POC review window. The verifier
  # independently queries the table, so expiry is never confused with data
  # correctness.
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: trinodb/trino:477
          command: ["/bin/sh", "-ec"]
          args:
            - |
              trino --server http://trino.data-mcp-poc.svc.cluster.local:8080 --execute "DROP TABLE IF EXISTS memory.default.account_risk; CREATE TABLE memory.default.account_risk AS SELECT * FROM (VALUES ('low', CAST(12 AS BIGINT), CAST(2400.00 AS DECIMAL(12,2))), ('medium', CAST(7 AS BIGINT), CAST(6100.00 AS DECIMAL(12,2))), ('high', CAST(3 AS BIGINT), CAST(9300.00 AS DECIMAL(12,2)))) AS t(risk_band, overdue_accounts, overdue_balance)"
