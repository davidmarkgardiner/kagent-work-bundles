apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-demo
  namespace: kyverno-recovery-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: registry-demo
  template:
    metadata:
      labels: *id001
    spec:
      restartPolicy: Always
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: docker.io/library/busybox:1.36
        command:
        - sh
        - -c
        - mkdir -p /tmp/www && echo recovered > /tmp/www/index.html && exec httpd
          -f -p 8080 -h /tmp/www
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 8Mi
          limits:
            cpu: 100m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: temporary
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 2
      volumes:
      - name: temporary
        emptyDir: {}
      terminationGracePeriodSeconds: 1
