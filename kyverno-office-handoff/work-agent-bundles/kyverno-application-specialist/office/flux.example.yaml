apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: '{{FLUX_SOURCE}}'
  namespace: '{{FLUX_NAMESPACE}}'
spec:
  interval: 30s
  url: 'https://{{APPROVED_GITLAB_HOST}}/{{DEMO_REPOSITORY_PATH}}.git'
  ref:
    branch: '{{DEMO_TARGET_BRANCH}}'
  secretRef:
    name: '{{FLUX_GIT_CREDENTIAL_SECRET}}'
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: '{{FLUX_KUSTOMIZATION}}'
  namespace: '{{FLUX_NAMESPACE}}'
spec:
  interval: 30s
  retryInterval: 10s
  timeout: 90s
  path: ./deploy
  prune: false
  sourceRef:
    kind: GitRepository
    name: '{{FLUX_SOURCE}}'
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: registry-demo
      namespace: '{{DEMO_NAMESPACE}}'
