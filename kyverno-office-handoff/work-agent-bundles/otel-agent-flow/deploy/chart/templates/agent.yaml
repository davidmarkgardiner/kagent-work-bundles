{{- if and (eq .Values.integration.mode "bundled") (ne .Values.execution.mode "standalone") }}
apiVersion: v1
kind: Secret
metadata: {name: flow-demo-client, namespace: {{ .Values.agentNamespace }}}
type: Opaque
stringData: {api-key: lab-gateway-authenticates-upstream}
---
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata: {name: flow-demo-model, namespace: {{ .Values.agentNamespace }}}
spec:
  provider: OpenAI
  model: {{ .Values.model.name | quote }}
  apiKeySecret: flow-demo-client
  apiKeySecretKey: api-key
  openAI:
    apiFormat: chatCompletions
    baseUrl: "http://flow-gateway.{{ .Release.Namespace }}.svc.cluster.local:8081/v1"
    maxTokens: 1200
    timeout: 90
{{- if eq .Values.tools.mode "fixture" }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata: {name: flow-demo-tools, namespace: {{ .Values.agentNamespace }}}
spec:
  description: Fixed read-only tools returning explicitly simulated workflow data.
  protocol: STREAMABLE_HTTP
  url: "http://flow-workflows.{{ .Release.Namespace }}.svc.cluster.local:8084/mcp"
{{- else }}
{{- range $name, $service := dict "flow-kubernetes-tools" "flow-kubernetes-mcp" "flow-gitlab-tools" "flow-gitlab-mcp" }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata: {name: {{ $name }}, namespace: {{ $.Values.agentNamespace }}}
spec:
  description: Live read-only tools with namespace or project scope enforced by the server.
  protocol: STREAMABLE_HTTP
  url: "http://{{ $service }}.{{ $.Release.Namespace }}.svc.cluster.local:8084/mcp"
{{- end }}
{{- end }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata: {name: flow-demo, namespace: {{ .Values.agentNamespace }}}
spec:
  kagent: {}
  workload: {image: {{ .Values.agentImage | quote }}}
  substrate:
    workerPoolRef: {name: {{ .Values.workerPool | quote }}}
    snapshotPolicy: {location: {{ .Values.snapshotLocation | quote }}}
  env: [{name: OTEL_BSP_SCHEDULE_DELAY, value: "300"}]
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata: {name: flow-demo, namespace: {{ .Values.agentNamespace }}}
spec:
  modelConfig: {name: flow-demo-model}
  systemPrompt: |-
{{ include "flow.instruction" . | indent 4 }}
  tools:
{{- range (include "flow.toolConnections" . | fromJsonArray) }}
  - mcp:
      server: {kind: RemoteMCPServer, name: {{ .server }}}
      tools: {{ .tools | toJson }}
{{- end }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata: {name: flow-demo-agent, namespace: {{ .Values.agentNamespace }}}
spec:
  harnessRef: {name: flow-demo}
  templateRef: {name: flow-demo}
{{- end }}
