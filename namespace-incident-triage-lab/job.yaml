apiVersion: batch/v1
kind: Job
metadata: {generateName: incident-scanner-, namespace: certificate-lab}
spec:
  activeDeadlineSeconds: 340
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: incident-scanner
      restartPolicy: Never
      containers:
        - name: scanner
          image: docker.io/alpine/k8s:1.35.0@sha256:18bc02c1e0df04451f4f9194eb7b7341c1165da5495459b52f85f72fb9545032
          command: [bash, /scripts/scan.sh]
          envFrom:
            - configMapRef: {name: incident-scanner-settings}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
          resources: {requests: {cpu: 20m, memory: 48Mi}, limits: {cpu: 250m, memory: 128Mi}}
      volumes:
        - name: scripts
          configMap: {name: incident-scripts}
