apiVersion: v1
kind: ServiceAccount
metadata: {name: cert-manager-incident-scanner, namespace: cert-manager}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: cert-manager-incident-scanner, namespace: cert-manager}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [cert-manager]
    verbs: [get]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [cert-manager-incident-state]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [cert-manager-incident-outcomes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: cert-manager-incident-scanner, namespace: cert-manager}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cert-manager-incident-scanner}
subjects: [{kind: ServiceAccount, name: cert-manager-incident-scanner, namespace: cert-manager}]
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: cert-manager-incident-scanner, namespace: cert-manager}
spec:
  schedule: "*/5 * * * *"
  timeZone: Etc/UTC
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 420
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: cert-manager-incident-scanner
          securityContext: {seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: scanner
              image: docker.io/library/python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
              command: [python, -B, /app/scanner.py]
              env:
                - {name: APP_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
                - {name: STATE_NAME, value: cert-manager-incident-state}
                - {name: OUTCOMES_NAME, value: cert-manager-incident-outcomes}
                - {name: INGRESS_URL, value: "http://lab-ingress.istio-system.svc.cluster.local/incidents/application-triage/"}
                - {name: INGRESS_HOST, value: application-incident.lab}
              securityContext: {runAsNonRoot: true, runAsUser: 10001, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {cpu: 250m, memory: 96Mi}}
              volumeMounts:
                - {name: code, mountPath: /app, readOnly: true}
                - {name: policy, mountPath: /policy, readOnly: true}
          volumes:
            - {name: code, configMap: {name: cert-manager-scan-code}}
            - {name: policy, configMap: {name: cert-manager-scan-policy}}
