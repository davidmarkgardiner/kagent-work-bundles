# OFFLINE REPRODUCTION ONLY. Never apply this policy to production.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: repro-peer-revision
spec:
  background: false
  rules:
    - name: restore-current-revision
      match:
        any:
          - resources:
              kinds: [PeerAuthentication]
              namespaces: [istio-rollback-repro]
              names: [repro-peer-mtls]
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              istio.io/rev: "1-29"
