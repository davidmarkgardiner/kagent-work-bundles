# Deliberately disabled. Enable only after the manual smoke tests in
# 03-TRIAGE-QUALITY-AND-DAILY-SMOKE.md are green and private values/identities
# have been wired through the approved GitOps path.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: evidence-first-daily-e2e-smoke
  namespace: "{{MANAGEMENT_NAMESPACE}}"
  labels:
    app.kubernetes.io/name: evidence-first-daily-e2e-smoke
    app.kubernetes.io/part-of: evidence-first-worker-triage
spec:
  schedule: "0 9 * * 1-5"
  timezone: "{{TIMEZONE}}"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  workflowSpec:
    serviceAccountName: "{{APPROVED_SMOKE_SERVICE_ACCOUNT}}"
    entrypoint: daily-smoke
    templates:
      - name: daily-smoke
        steps:
          - - name: trigger-worker-fixture
              template: marker
              arguments:
                parameters:
                  - name: message
                    value: "SMOKE_FIXTURE_TRIGGER: configure approved worker-scoped trigger"
          - - name: assert-kafka-to-ticket
              template: marker
              arguments:
                parameters:
                  - name: message
                    value: "SMOKE_E2E_ASSERTION: configure Kafka, workflow, AKS MCP and GitLab assertion"
          - - name: cleanup-fixture
              template: marker
              arguments:
                parameters:
                  - name: message
                    value: "SMOKE_CLEANUP: configure approved worker-scoped cleanup"
      - name: marker
        inputs:
          parameters:
            - name: message
        container:
          image: busybox:1.36
          command: [sh, -ceu]
          args:
            - |
              echo "{{inputs.parameters.message}}"
              echo "OUTPUT_SANITIZED: yes"
