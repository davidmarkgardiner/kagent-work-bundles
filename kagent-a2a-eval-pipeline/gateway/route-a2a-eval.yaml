# Dedicated agentgateway route for CI evals. DEPLOY ON: the cluster running kagent.
#
#   https://{{AGW_HOST}}/a2a/kagent/<agent>/  ->  kagent-controller:8083/api/a2a/kagent/<agent>/
#
# One rule per agent under test = explicit allowlist: CI can only reach the
# agents listed here, not every agent in the namespace. ReplacePrefixMatch keeps
# the trailing slash kagent requires.
#
# Verify against YOUR installed gateway before relying on it:
#   kubectl apply --dry-run=server -f route-a2a-eval.yaml
#   curl -s -o /dev/null -w '%{http_code}\n' -X POST https://{{AGW_HOST}}/a2a/kagent/{{AGENT}}/ \
#     -H "Authorization: Bearer $AGW_TOKEN" -H 'Content-Type: application/json' -d '{}'
# The existing platform/agentgateway/route-a2a-fleet-agent.yaml is a fixed
# single-agent route (/a2a/fleet/); it is not a general per-agent path.
# Reuses the ReferenceGrant in platform/agentgateway/service-a2a-fleet-agent.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: a2a-eval-route
  namespace: agentgateway-system
  labels: {app.kubernetes.io/part-of: agentgateway, purpose: agent-eval}
spec:
  parentRefs:
    - name: ai-gateway          # OVERRIDE to your Gateway name
      namespace: agentgateway-system
  rules:
    - matches:
        - path: {type: PathPrefix, value: /a2a/kagent/{{AGENT_UNDER_TEST}}/}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /api/a2a/kagent/{{AGENT_UNDER_TEST}}/}
      backendRefs:
        - {name: kagent-controller, namespace: kagent, port: 8083}
    # Copy the rule above for each additional agent under test.
---
# Auth + budget for the eval caller. JWT shape mirrors
# platform/agentgateway/authentication-policy.yaml; adjust to your IdP.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: a2a-eval-policy
  namespace: agentgateway-system
  labels: {app.kubernetes.io/part-of: agentgateway, purpose: agent-eval}
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: a2a-eval-route}
  traffic:
    rateLimit:
      local:
        - {requests: 1, unit: Seconds, burst: 3}
    timeouts:
      request: "300s"   # >= EVAL_TIMEOUT_S in CI, investigations are slow
