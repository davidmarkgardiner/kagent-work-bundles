# Demo: a "broken" agent whose model route always answers 429 (like a model out of quota), and the stub that does it.
# Needs a python image your cluster can pull ("{{PYTHON_IMAGE}}", mirrored internally in an air-gapped cluster).
apiVersion: v1
kind: Namespace
metadata: {name: guard-demo, labels: {guard-demo: "true"}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: model-stub, namespace: guard-demo}
data:
  stub.py: |
    # Fake OpenAI-compatible model route that always answers 429. Demo only.
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer
    class H(BaseHTTPRequestHandler):
        def _r(self):
            body = json.dumps({"error": {"message": "Rate limit reached for demo-stub (synthetic 429)", "type": "rate_limit_exceeded"}}).encode()
            self.send_response(429); self.send_header("Content-Type", "application/json"); self.send_header("Retry-After", "60")
            self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
        do_POST = do_GET = _r
        def log_message(self, *a): pass
    HTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: model-stub, namespace: guard-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: model-stub}}
  template:
    metadata: {labels: {app: model-stub}}
    spec:
      containers:
      - name: stub
        image: "{{PYTHON_IMAGE}}"
        imagePullPolicy: IfNotPresent
        command: ["python", "/app/stub.py"]
        ports: [{containerPort: 8080}]
        volumeMounts: [{name: app, mountPath: /app}]
      volumes: [{name: app, configMap: {name: model-stub}}]
---
apiVersion: v1
kind: Service
metadata: {name: model-stub, namespace: guard-demo}
spec: {selector: {app: model-stub}, ports: [{port: 8080, targetPort: 8080}]}
---
apiVersion: v1
kind: Secret
metadata: {name: demo-stub-key, namespace: kagent}
stringData: {api-key: not-a-real-key}
---
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata: {name: demo-stub-429, namespace: kagent, labels: {guard-demo: "true"}}
spec:
  provider: OpenAI
  model: demo-stub
  apiKeySecret: demo-stub-key
  apiKeySecretKey: api-key
  openAI: {apiFormat: chatCompletions, baseUrl: "http://model-stub.guard-demo.svc.cluster.local:8080/v1", maxTokens: 200, timeout: 30}
  stream: true
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata: {name: demo-worker, namespace: kagent, labels: {guard-demo: "true"}}
spec:
  harnessRef: {name: "{{HARNESS}}"}
  template:
    inline:
      description: "Demo worker for the self-healing demo. Answers one short question; no tools."
      modelConfig: {name: demo-stub-429}
      systemPrompt: "You are a demo worker. Answer the user in one short sentence. Do not use tools."
