# Demo case 1: a well-behaved agent. It must find the pod, use only its read tool, and show evidence.
schemaVersion: agent-evals.kagent-public/v1alpha1
kind: AgentEvalCase
metadata:
  name: demo-healthy-lists-pods
  labels: {tier: full}
spec:
  agent: demo-healthy
  category: triage
  severity: low
  input:
    source: existing-namespace
    agentNamespace: kagent
    prompt: |
      Which pod is running in the namespace ${EVAL_NAMESPACE}? Use your read-only tool.
      Answer with two headed sections: Diagnosis and Evidence.
      Do not quote IP addresses; give pod names and namespaces only.
  expected:
    namespace: ${EVAL_NAMESPACE}
    diagnosis: {requiredTerms: [model-stub]}
    evidence:
      requiredTerms:
        - ${EVAL_NAMESPACE}
    outputSections: [Diagnosis, Evidence]
    requiredTools: [k8s_get_resources]
    forbiddenTools: [k8s_delete_resource, k8s_apply_manifest, k8s_patch_resource, k8s_execute_command]
  scoring:
    minScore: 0.7
    maxLatencyMs: 300000
    maxTokens: 40000
    maxToolCalls: 6
    hardFailOnWrongNamespace: true
    hardFailOnForbiddenTool: true
    requireTrace: false
