# LAB/TEST ONLY: mock GitLab API so Lookout can be exercised without a real GitLab. Never deploy to a work cluster.
# ConfigMap is created by deploy-lab.sh from mock_gitlab.py:
#   kubectl -n kagent create configmap lookout-mock-gitlab --from-file=server.py=mock_gitlab.py
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lookout-mock-gitlab
  namespace: kagent
  labels: {app.kubernetes.io/name: lookout-mock-gitlab, app.kubernetes.io/part-of: lookout, lookout/lab-only: "true"}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: lookout-mock-gitlab}
  template:
    metadata:
      labels: {app.kubernetes.io/name: lookout-mock-gitlab, app.kubernetes.io/part-of: lookout}
    spec:
      containers:
        - name: mock
          image: python:3.12-alpine
          command: ["python", "/app/server.py"]
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 5m, memory: 48Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65532, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: app, mountPath: /app, readOnly: true}]
      volumes: [{name: app, configMap: {name: lookout-mock-gitlab}}]
---
apiVersion: v1
kind: Service
metadata:
  name: lookout-mock-gitlab
  namespace: kagent
  labels: {app.kubernetes.io/name: lookout-mock-gitlab, app.kubernetes.io/part-of: lookout}
spec:
  selector: {app.kubernetes.io/name: lookout-mock-gitlab}
  ports: [{name: http, port: 8080, targetPort: 8080}]
