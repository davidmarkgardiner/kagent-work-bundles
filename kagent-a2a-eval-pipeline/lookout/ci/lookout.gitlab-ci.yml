# Lookout CI template. Other projects add:
#   include:
#     - project: '{{PLATFORM_PROJECT}}'
#       file: '/lookout/ci/lookout.gitlab-ci.yml'
#
# Project/group CI variables (masked + protected where they are secrets):
#   AGW_BASE_URL   agentgateway base URL
#   AGW_TOKEN      gateway token for the caller (masked)
#   LOOKOUT_DISABLED=true  to switch it off for a project
#
# The runner image must contain lookout_review.py and a2a_capture.py (the Assay runner image does).
# Advisory by design: allow_failure true, and the script exits 0 unless --strict is passed.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

variables:
  LOOKOUT_SCRIPT: /opt/lookout/lookout_review.py
  LOOKOUT_IMAGE: "{{RUNNER_IMAGE}}"

lookout:review:
  stage: test
  image: $LOOKOUT_IMAGE
  # One review at a time per MR so concurrent pipelines cannot post duplicate notes.
  resource_group: lookout-mr-$CI_MERGE_REQUEST_IID
  interruptible: true
  allow_failure: true
  timeout: 10m
  rules:
    - if: '$LOOKOUT_DISABLED == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^(Draft|WIP):/i'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - python "$LOOKOUT_SCRIPT" --out out/lookout
  artifacts:
    when: always
    expire_in: 3 days
    # run.json only. The raw receipt contains code from the MR; keep it out of artifacts.
    paths: [out/lookout/lookout-run.json]
