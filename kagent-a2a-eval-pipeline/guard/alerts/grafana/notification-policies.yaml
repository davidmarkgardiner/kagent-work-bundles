apiVersion: 1
policies:
  - orgId: 1
    receiver: guard-human-page            # anything unmatched goes to a person, never to an agent
    group_by: [alertname]
    routes:
      - receiver: guard-human-page
        object_matchers: [["route", "=", "human-only"]]
        group_wait: 0s
        repeat_interval: 1h
      - receiver: guard-human-page        # Grafana's own error alerts inherit the rule's labels (guard=true): keep them away from the agent
        object_matchers: [["alertname", "=~", "DatasourceError|DatasourceNoData"]]
        group_wait: 0s
      - receiver: guard-agent-intake
        object_matchers: [["guard", "=", "true"], ["route", "!=", "human-only"]]
        group_by: [alertname, service_name, tool]   # one group per offender, so a big group cannot be truncated at maxAlerts
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h               # Grafana re-sends a still-firing alert at this interval; alert_to_a2a dedupes inside its window
