<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1810" role="img" aria-labelledby="title desc">
<title id="title">Add release and runtime evaluation</title><desc id="desc">Proposed DICE architecture, stage 4. Keep the observability layer. Add a release evaluation path and runtime assessments under approved data, identity and spend limits. Bind every verdict to the exact agent, skill, tool, policy and model versions. Solid arrows show calls. Dashed arrows show credentials, telemetry or evidence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="100%" height="100%" fill="#F4F3EE"/>
<text x="60" y="65" font-size="43" fill="#1C1C1C" font-weight="600" text-anchor="start" >04  /  Add release and runtime evaluation</text><text x="60" y="110" font-size="25" fill="#555952" font-weight="400" text-anchor="start" >Judge behavior against explicit cases and keep reviewable receipts.</text><g class="node"><rect x="60" y="170" width="500" height="175" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M60 170H560" stroke="#C72127" stroke-width="5"/><text x="82" y="213" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >Microsoft Entra ID</text><text x="82" y="252" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Federated workload authenticates</text><text x="82" y="282" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Entra issues destination access JWTs</text></g><g class="node"><rect x="710" y="170" width="530" height="175" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M710 170H1240" stroke="#C72127" stroke-width="5"/><text x="732" y="213" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >Trusted credential adapter</text><text x="732" y="252" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Projected assertion → token exchange</text><text x="732" y="282" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >SDK caches and reacquires on expiry</text></g><g class="node"><rect x="1370" y="170" width="490" height="175" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M1370 170H1860" stroke="#C72127" stroke-width="5"/><text x="1392" y="213" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >Federated trust + API grants</text><text x="1392" y="252" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >AKS issuer + subject + audience</text><text x="1392" y="282" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >UAMI identity + destination grants</text></g><rect x="380" y="410