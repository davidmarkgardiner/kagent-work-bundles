xt></g><g class="node"><rect x="660" y="815" width="650" height="110" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M660 815H1310" stroke="#CCCABC" stroke-width="5"/><text x="682" y="858" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >Reviewed delivery</text><text x="682" y="897" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Git + Flux + KRO · policies, agents, pinned skills</text></g><g class="node"><rect x="1460" y="815" width="350" height="110" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M1460 815H1810" stroke="#CCCABC" stroke-width="5"/><text x="1482" y="858" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >Backend API / data</text><text x="1482" y="897" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >MCP identity + grants</text></g><path d="M1280 815V785H1240V685" fill="none" stroke="#555952" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="185" y="475" font-size="21" fill="#C72127" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">Agent-API JWT</text><text x="1195" y="398" font-size="21" fill="#C72127" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">Separate destination credentials</text><text x="375" y="556" font-size="21" fill="#555952" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">HTTPS</text><text x="850" y="533" font-size="21" fill="#555952" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">Invoke</text><text x="850" y="625" font-size="21" fill="#555952" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">Tool / model</text><text x="1135" y="741" font-size="21" fill="#555952" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">Authorized MCP route · destination token</text><text x="385" y="800" font-size="21" fill="#555952" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">Model route</text><text x="1730" y="780" font-size="21" fill="#555952" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">Backend token</text><text x="60" y="1020" font-size="23" fill="#C72127" font-weight="600" text-anchor="start" >Identity change</text><text x="290" y="1020" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >No stored client secret or provisioned bearer token for this federated path.</text><text x="60" y="1063" font-size="23" fill="#555952" font-weight="400" text-anchor="start" >Short-lived assertions and access tokens still exist. Keep them outside prompts, tool results and telemetry.</text><path d="M1615 170V145H310V170" fill="none" stroke="#C72127" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="1030" y="140" font-size="20" fill="#C72127" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">Configured federation trust</text><path d="M560 230H710" fill="none" stroke="#C72127" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><path d="M710 290H560" fill="none" stroke="#C72127" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="635" y="269" font-size="18" fill="#C72127" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">Exchange</text><text x="1120" y="1140" font-size="21" fill="#245F86" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">Gateway decisions + agent spans + MCP operations</text><g class="node"><rect x="60" y="1170" width="780" height="180" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M60 1170H840" stroke="#245F86" stroke-width="5"/><text x="82" y="1213" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >OpenTelemetry + Alloy</text><text x="82" y="1252" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Propagate trace context across instrumented hops</text><text x="82" y="1282" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Filter credentials and approved metadata before export</text></g><g class="node"><rect x="990" y="1170" width="870" height="180" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M990 1170H1860" stroke="#245F86" stroke-width="5"/><text x="1012" y="1213" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >LGTM observability</text><text x="1012" y="1252" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Loki logs · Grafana dashboards · Tempo traces · Mimir metrics</text><text x="1012" y="1282" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Errors, latency, policy decisions and provider-reported usage</text></g><path d="M840 1255H990" fill="none" stroke="#245F86" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="915" y="1230" font-size="21" fill="#245F86" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">Export</text><text x="990" y="1400" font-size="23" fill="#555952" font-weight="400" text-anchor="start" >Telemetry describes execution. Evaluation judges behavior.</text><g class="node"><rect x="60" y="1500" width="535" height="205" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M60 1500H595" stroke="#28634B" stroke-width="5"/><text x="82" y="1543" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >Release evaluation</text><text x="82" y="1582" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Versioned candidate + cases + rubric</text><text x="82" y="1612" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Functional, tool, security, quality checks</text><text x="82" y="1642" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >PASS / FAIL / UNKNOWN receipt</text></g><g class="node"><rect x="710" y="1500" width="535" height="205" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M710 1500H1245" stroke="#28634B" stroke-width="5"/><text x="732" y="1543" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >Runtime assessment</text><text x="732" y="1582" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Approved samples or replay cases</text><text x="732" y="1612" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Expected outcomes + permitted evidence</text><text x="732" y="1642" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Identity, data and spend limits</text></g><g class="node"><rect x="1360" y="1500" width="500" height="205" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M1360 1500H1860" stroke="#28634B" stroke-width="5"/><text x="1382" y="1543" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >Evidence + review</text><text x="1382" y="1582" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Bind verdict to exact versions</text><text x="1382" y="1612" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Existing promotion approval</text><text x="1382" y="1642" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Findings → next reviewed revision</text></g><path d="M450 1350V1450H975V1500" fill="none" stroke="#28634B" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="940" y="1475" font-size="21" fill="#28634B" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">Approved evidence</text><path d="M327 1705V1735H1610V1705" fill="none" stroke="#28634B" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="975" y="1725" font-size="21" fill="#28634B" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">Release receipt</text><path d="M1245 1650H1360" fill="none" stroke="#28634B" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="1302" y="1628" font-size="19" fill="#28634B" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">Finding</text><text x="60" y="1765" font-size="23" fill="#555952" font-weight="400" text-anchor="start" >A release verdict informs the existing Git review and promotion process. It does not grant deployment permissions.</text></svg>