<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1120" role="img" aria-labelledby="title desc">
<title id="title">Start with JWT authentication</title><desc id="desc">Proposed DICE architecture, stage 1. The client presents a signed JWT. The receiving gateway validates it and authorizes the requested agent or operation. The agent uses separate credentials for tool and model calls. Solid arrows show calls. Dashed arrows show credentials, telemetry or evidence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="100%" height="100%" fill="#F4F3EE"/>
<text x="60" y="65" font-size="43" fill="#1C1C1C" font-weight="600" text-anchor="start" >01  /  Start with JWT authentication</text><text x="60" y="110" font-size="25" fill="#555952" font-weight="400" text-anchor="start" >Protect the agent API and its tool routes.</text><g class="node"><rect x="60" y="170" width="500" height="175" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M60 170H560" stroke="#C72127" stroke-width="5"/><text x="82" y="213" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >Trusted JWT issuer</text><text x="82" y="252" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Signs destination access tokens</text><text x="82" y="282" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Publishes public validation keys</text></g><g class="node"><rect x="710" y="170" width="530" height="175" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M710 170H1240" stroke="#C72127" stroke-width="5"/><text x="732" y="213" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >Provisioned credentials</text><text x="732" y="252" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Bearer tokens in Kubernetes Secrets</text><text x="732" y="282" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Owner manages expiry and rotation</text></g><g class="node"><rect x="1370" y="170" width="490" height="175" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M1370 170H1860" stroke="#CCCABC" stroke-width="5"/><text x="1392" y="213" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >API trust and permission</text><text x="1392" y="252" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Trusted issuer and audience</text><text x="1392" y="282" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Caller + operation allowlists</text></g><rect x="380" y="410" width="1490" height="370" fill="#F9F9F7" stroke="#CCCABC" stroke-width="2"/><text x="405" y="450" font-size="23" fill="#555952" font-weight="400" text-anchor="start" >Kubernetes service boundary</text><path d="M310 345V390H185V510" fill="none" stroke="#555952" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><path d="M975 345V475H1115V510" fill="none" stroke="#555952" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><path d="M320 575H430" fill="none" stroke="#1C1C1C" stroke-width="3" marker-end="url(#arrow)"/><path d="M780 550H920" fill="none" stroke="#1C1C1C" stroke-width="3" marker-end="url(#arrow)"/><path d="M920 640H780" fill="none" stroke="#1C1C1C" stroke-width="3" marker-end="url(#arrow)"/><path d="M680 685V755H1635V685" fill="none" stroke="#1C1C1C" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 685V815H320" fill="none" stroke="#1C1C1C" stroke-width="3" marker-end="url(#arrow)"/><path d="M1660 685V815" fill="none" stroke="#1C1C1C" stroke-width="3" marker-end="url(#arrow)"/><g class="node"><rect x="50" y="510" width="270" height="175" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M50 510H320" stroke="#CCCABC" stroke-width="5"/><text x="72" y="553" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >API consumer</text><text x="72" y="592" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Application workload</text><text x="72" y="622" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Agent API access JWT</text></g><g class="node"><rect x="430" y="510" width="350" height="175" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M430 510H780" stroke="#C72127" stroke-width="5"/><text x="452" y="553" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >Agent Gateway</text><text x="452" y="592" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >JWT validation + policy</text><text x="452" y="622" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Agent, tool, model routes</text></g><g class="node"><rect x="920" y="510" width="390" height="175" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M920 510H1310" stroke="#CCCABC" stroke-width="5"/><text x="942" y="553" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >Agent runtime</text><text x="942" y="592" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Reviewed skills + instructions</text><text x="942" y="622" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Uses trusted adapter for auth</text></g><g class="node"><rect x="1460" y="510" width="350" height="175" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M1460 510H1810" stroke="#CCCABC" stroke-width="5"/><text x="1482" y="553" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >MCP service</text><text x="1482" y="592" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Typed, bounded operations</text><text x="1482" y="622" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Separate backend identity</text></g><g class="node"><rect x="50" y="815" width="270" height="150" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M50 815H320" stroke="#CCCABC" stroke-width="5"/><text x="72" y="858" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >Model garden</text><text x="72" y="897" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Approved inference</text><text x="72" y="927" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >LLM endpoints</text></g><g class="node"><rect x="660" y="815" width="650" height="110" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M660 815H1310" stroke="#CCCABC" stroke-width="5"/><text x="682" y="858" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >Reviewed delivery</text><text x="682" y="897" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Git + Flux + KRO · policies, agents, pinned skills</text></g><g class="node"><rect x="1460" y="815" width="350" height="110" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M1460 815H1810" stroke="#CCCABC" stroke-width="5"/><text x="1482" y="858" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >Backend API / data</text><text x="1482" y="897" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >MCP identity + grants</text></g><path d="M1280 815V785H1240V685" fill="none" stroke="#555952" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="185" y="475" font-size="21" fill="#555952" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">Agent-API JWT</text><text x="1195" y="398" font-size="21" fill="#555952" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">Separate destination credentials</text><text x="375" y="556" font-size="21" fill="#555952" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">HTTPS</text><text x="850" y="533" font-size="21" fill="#555952" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">Invoke</text><text x="850" y="625" font-size="21" fill="#555952" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">Tool / model</text><text x="1135" y="741" font-size="21" fill="#555952" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">Authorized MCP route · destination token</text><text x="385" y="800" font-size="21" fill="#555952" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">Model route</text><text x="1730" y="780" font-size="21" fill="#555952" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">Backend token</text><text x="60" y="1020" font-size="23" fill="#C72127" font-weight="600" text-anchor="start" >Baseline choice</text><text x="290" y="1020" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Stored bearer tokens illustrate the starting point. JWT does not require Kubernetes Secret storage.</text><text x="60" y="1063" font-size="23" fill="#555952" font-weight="400" text-anchor="start" >Validate signature, issuer, audience, time and permissions. Do not pass caller tokens to unrelated destinations.</text></svg>