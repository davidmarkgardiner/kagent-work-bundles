<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1425" role="img" aria-labelledby="title desc">
<title id="title">The workload identity handshake</title><desc id="desc">Sequence showing direct AKS workload federation to a UAMI. A projected Kubernetes JWT is exchanged with Microsoft Entra for a destination-specific access JWT. Both remain sensitive credentials.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="100%" height="100%" fill="#F4F3EE"/>
<text x="60" y="65" font-size="43" fill="#1C1C1C" font-weight="600" text-anchor="start" >02a  /  The workload identity handshake</text><text x="60" y="110" font-size="25" fill="#555952" font-weight="400" text-anchor="start" >Direct AKS federation to a UAMI. The final access token is for the receiving API.</text><g class="node"><rect x="60" y="170" width="400" height="135" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M60 170H460" stroke="#C72127" stroke-width="5"/><text x="82" y="213" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >AKS service account</text><text x="82" y="252" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Projected, rotating JWT assertion</text></g><g class="node"><rect x="570" y="170" width="420" height="135" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M570 170H990" stroke="#C72127" stroke-width="5"/><text x="592" y="213" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >Trusted SDK / adapter</text><text x="592" y="252" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Runs with the workload identity</text></g><g class="node"><rect x="1100" y="170" width="350" height="135" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M1100 170H1450" stroke="#C72127" stroke-width="5"/><text x="1122" y="213" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >Microsoft Entra ID</text><text x="1122" y="252" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Federated UAMI trust</text></g><g class="node"><rect x="1560" y="170" width="300" height="135" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M1560 170H1860" stroke="#C72127" stroke-width="5"/><text x="1582" y="213" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >Receiving API</text><text x="1582" y="252" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >JWT + operation policy</text></g><path d="M260 305V1010" fill="none" stroke="#CCCABC" stroke-width="3" stroke-dasharray="9 7" /><path d="M780 305V1010" fill="none" stroke="#CCCABC" stroke-width="3" stroke-dasharray="9 7" /><path d="M1275 305V1010" fill="none" stroke="#CCCABC" stroke-width="3" stroke-dasharray="9 7" /><path d="M1710 305V1010" fill="none" stroke="#CCCABC" stroke-width="3" stroke-dasharray="9 7" /><path d="M260 400H780" fill="none" stroke="#C72127" stroke-width="3" marker-end="url(#arrow)"/><text x="520.0" y="378" font-size="22" fill="#C72127" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">1  Read the projected service-account assertion</text><path d="M780 520H1275" fill="none" stroke="#C72127" stroke-width="3" marker-end="url(#arrow)"/><text x="1027.5" y="498" font-size="22" fill="#C72127" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">2  Exchange assertion for destination access</text><path d="M1275 750H780" fill="none" stroke="#C72127" stroke-width="3" marker-end="url(#arrow)"/><text x="1027.5" y="728" font-size="22" fill="#C72127" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">3  Return a short-lived destination access token</text><path d="M780 880H1710" fill="none" stroke="#1C1C1C" stroke-width="3" marker-end="url(#arrow)"/><text x="1245.0" y="858" font-size="22" fill="#1C1C1C" font-weight="400" text-anchor="middle" paint-order="stroke" stroke="#F4F3EE" stroke-width="8" stroke-linejoin="round">4  Call the approved API with its access token</text><g class="node"><rect x="1070" y="565" width="430" height="125" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M1070 565H1500" stroke="#C72127" stroke-width="5"/><text x="1092" y="608" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >Entra verifies trust</text><text x="1092" y="647" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Issuer + subject + assertion aud</text><text x="1092" y="677" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >UAMI permissions for the API</text></g><g class="node"><rect x="1505" y="925" width="365" height="125" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M1505 925H1870" stroke="#CCCABC" stroke-width="5"/><text x="1527" y="968" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >API permission checks</text><text x="1527" y="1007" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Signature, issuer, time, API aud</text><text x="1527" y="1037" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Required role or caller ACL</text></g><g class="node"><rect x="60" y="1090" width="890" height="185" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M60 1090H950" stroke="#C72127" stroke-width="5"/><text x="82" y="1133" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >Two audiences with different jobs</text><text x="82" y="1172" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Assertion aud = api://AzureADTokenExchange</text><text x="82" y="1202" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Access-token aud = the registered destination API</text><text x="82" y="1232" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Never use the federation assertion as the API bearer token</text></g><g class="node"><rect x="1010" y="1090" width="850" height="185" fill="white" stroke="#CCCABC" stroke-width="2"/><path d="M1010 1090H1860" stroke="#C72127" stroke-width="5"/><text x="1032" y="1133" font-size="29" fill="#1C1C1C" font-weight="600" text-anchor="start" >What this removes from Kubernetes Secrets</text><text x="1032" y="1172" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >No static client secret or private signing key for this path</text><text x="1032" y="1202" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >No manually provisioned destination bearer token</text><text x="1032" y="1232" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >Projected assertion + access token remain sensitive</text></g><text x="60" y="1332" font-size="23" fill="#1C1C1C" font-weight="400" text-anchor="start" >The SDK reacquires access as tokens expire. Restrict the adapter to approved destinations and registered workload identities.</text><text x="60" y="1377" font-size="23" fill="#555952" font-weight="400" text-anchor="start" >Repeat with separate identities for caller, agent and MCP backend. This view does not imply Entra Agent ID or user delegation.</text></svg>