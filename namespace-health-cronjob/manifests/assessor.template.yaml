apiVersion: v1
kind: ConfigMap
metadata: {name: namespace-health-policy, namespace: health-trial, labels: {app.kubernetes.io/part-of: namespace-health-trial}}
data:
  policy.json: '{{POLICY_JSON}}'
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: namespace-health-assessor, namespace: health-trial, labels: {app.kubernetes.io/part-of: namespace-health-trial}}
spec:
  schedule: "0 * * * *"
  timeZone: Etc/UTC
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 180
      backoffLimit: 1
      template:
        metadata: {labels: {app.kubernetes.io/part-of: namespace-health-trial}}
        spec:
          serviceAccountName: namespace-health-assessor
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
          containers:
          - name: assessor
            image: namespace-health:lab-arm64
            imagePullPolicy: IfNotPresent
            securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
            resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
            env:
            - {name: POLICY_PATH, value: /etc/namespace-health/policy.json}
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: CLUSTER_ID, value: kind-namespace-health}
            - {name: CLUSTER_UID, value: "{{CLUSTER_UID}}"}
            - {name: SOURCE_GENERATION, value: lab-g1}
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: kafka.health-trial.svc:9092}
            - {name: KAFKA_SECURITY_PROTOCOL, value: PLAINTEXT}
            - {name: LAB_PLAINTEXT, value: "true"}
            - {name: KAFKA_TOPIC, value: namespace-health-trial-v1}
            - {name: RUN_MODE, value: scheduled}
            volumeMounts: [{name: policy, mountPath: /etc/namespace-health, readOnly: true}]
          volumes: [{name: policy, configMap: {name: namespace-health-policy}}]
