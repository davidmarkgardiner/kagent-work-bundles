---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: namespace-health-trial-namespace-ids, labels: {app.kubernetes.io/part-of: namespace-health-trial}}
rules:
- apiGroups: [""]
  resources: [namespaces]
  resourceNames: [kube-system, health-fixture-a, health-fixture-b, health-fixture-c, health-fixture-d, health-fixture-e]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
