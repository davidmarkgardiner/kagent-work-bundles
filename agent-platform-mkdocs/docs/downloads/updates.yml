- id: calendar-and-commit-checks
  title: A delivery calendar that stays with the documentation
  published: '2026-11-18'
  period:
    label: Delivery reference update
    start: null
    end: '2026-11-18'
  reviewer: Documentation and offline source checks; receiving CI activation pending
  summary: The roadmap now reads across Q4 and Q1 with named agent, MCP/skills and governance lanes. A
    source check requires a delivery-impact decision alongside relevant documentation changes.
  achievements:
  - milestone: DOCS
    outcome: A month-by-month calendar groups Agents, Tools and Governance.
    why_it_matters: Stakeholders can distinguish accepted builds, service go-lives and proposed next outcomes
      in one view.
    evidence:
    - label: Documentation validation
      url: downloads/validation.json
      scope: documentation
      reviewed: '2026-11-18'
  - milestone: SDLC
    outcome: Repository instructions and Git-diff checks keep roadmap updates in the same reviewed change.
    why_it_matters: Documentation changes cannot silently skip delivery classification; built/live transitions
      require evidence and a new reporting entry.
    evidence:
    - label: Documentation and commit-check receipt
      url: downloads/validation.json
      scope: offline
      reviewed: '2026-11-18'
  moved:
  - milestone: SDLC
    from: next
    to: built
    reason: Staged and committed-diff checks passed fixture acceptance scenarios.
