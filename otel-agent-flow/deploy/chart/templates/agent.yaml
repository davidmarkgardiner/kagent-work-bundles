{{- if eq .Values.integration.mode "bundled" }}
apiVersion: v1
kind: Secret
metadata: {name: flow-demo-client, namespace: {{ .Values.agentNamespace }}}
type: Opaque
stringData: {api-key: lab-gateway-authenticates-upstream}
---
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata: {name: flow-demo-model, namespace: {{ .Values.agentNamespace }}}
spec:
  provider: OpenAI
  model: {{ .Values.model.name | quote }}
  apiKeySecret: flow-demo-client
  apiKeySecretKey: api-key
  openAI:
    apiFormat: chatCompletions
    baseUrl: "http://flow-gateway.{{ .Release.Namespace }}.svc.cluster.local:8081/v1"
    maxTokens: 1200
    timeout: 90
{{- if eq .Values.tools.mode "fixture" }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata: {name: flow-demo-tools, namespace: {{ .Values.agentNamespace }}}
spec:
  description: Fixed read-only tools returning explicitly simulated workflow data.
  protocol: STREAMABLE_HTTP
  url: "http://flow-workflows.{{ .Release.Namespace }}.svc.cluster.local:8084/mcp"
{{- else }}
{{- range $name, $service := dict "flow-kubernetes-tools" "flow-kubernetes-mcp" "flow-gitlab-tools" "flow-gitlab-mcp" }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata: {name: {{ $name }}, namespace: {{ $.Values.agentNamespace }}}
spec:
  description: Live read-only tools with namespace or project scope enforced by the server.
  protocol: STREAMABLE_HTTP
  url: "http://{{ $service }}.{{ $.Release.Namespace }}.svc.cluster.local:8084/mcp"
{{- end }}
{{- end }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata: {name: flow-demo, namespace: {{ .Values.agentNamespace }}}
spec:
  kagent: {}
  workload: {image: {{ .Values.agentImage | quote }}}
  substrate:
    workerPoolRef: {name: {{ .Values.workerPool | quote }}}
    snapshotPolicy: {location: {{ .Values.snapshotLocation | quote }}}
  env: [{name: OTEL_BSP_SCHEDULE_DELAY, value: "300"}]
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata: {name: flow-demo, namespace: {{ .Values.agentNamespace }}}
spec:
  modelConfig: {name: flow-demo-model}
{{- if eq .Values.tools.mode "live" }}
  systemPrompt: >-
    You inspect actual Kubernetes and GitLab data using only the registered read tools.
    Call only the tools requested by the user. Kubernetes scope is namespace {{ .Release.Namespace }}. When requested, call k8s_get_resources
    with resource_type deployment, namespace {{ .Release.Namespace }}, and output wide.
    GitLab tools are fixed to one approved project. Read current project metadata,
    up to five recent issues, and latest pipeline status when requested. Never invent
    results or claim that fixture data is live. State tool errors clearly. Do not
    mutate Kubernetes, create issues, trigger pipelines, or write GitLab content.
  tools:
  - mcp:
      server: {kind: RemoteMCPServer, name: flow-kubernetes-tools}
      tools: [k8s_get_resources, k8s_get_events]
  - mcp:
      server: {kind: RemoteMCPServer, name: flow-gitlab-tools}
      tools: [gitlab_get_project, gitlab_list_issues, gitlab_get_latest_pipeline]
{{- else }}
  systemPrompt: >-
    You demonstrate agent workflows in a Substrate sandbox. Follow the requested
    DEMO_WORKFLOW by calling the named tools in order. All tool data is explicitly
    simulated. Explain fixture results and intentional dependency failures clearly.
    Never claim to have inspected or changed the real cluster. Do not retry a simulated
    failure. Never invent telemetry, token prices, deployments, or approvals.
  tools:
  - mcp:
      server: {kind: RemoteMCPServer, name: flow-demo-tools}
      tools: [get_inventory_status, get_recent_alerts, review_change, check_dependency, get_kubernetes_workloads, query_grafana_alerts, get_gitlab_issue, get_gitlab_pipeline, read_team_a_resource, attempt_cross_team_resource, read_team_b_resource]
{{- end }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata: {name: flow-demo-agent, namespace: {{ .Values.agentNamespace }}}
spec:
  harnessRef: {name: flow-demo}
  templateRef: {name: flow-demo}
{{- end }}
