apiVersion: v1
kind: Namespace
metadata:
  name: otel-agent-flow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flow-collector
  namespace: otel-agent-flow
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 192
        spike_limit_mib: 48
      batch:
        timeout: 200ms
        send_batch_size: 64
    exporters:
      otlp_http/dashboard:
        endpoint: http://flow-dashboard:8787
        encoding: json
        compression: none
        retry_on_failure:
          enabled: true
          max_elapsed_time: 30s
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp_http/dashboard]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp_http/dashboard]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-collector
  namespace: otel-agent-flow
spec:
  replicas: 1
  selector:
    matchLabels: {app: flow-collector}
  template:
    metadata:
      labels: {app: flow-collector}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: collector
          image: otel/opentelemetry-collector:0.146.0
          args: [--config=/config/config.yaml]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          ports:
            - {name: grpc, containerPort: 4317}
            - {name: http, containerPort: 4318}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
      volumes:
        - name: config
          configMap: {name: flow-collector}
---
apiVersion: v1
kind: Service
metadata:
  name: flow-collector
  namespace: otel-agent-flow
spec:
  selector: {app: flow-collector}
  ports:
    - {name: grpc, port: 4317, targetPort: 4317}
    - {name: http, port: 4318, targetPort: 4318}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-dashboard
  namespace: otel-agent-flow
spec:
  replicas: 1
  selector:
    matchLabels: {app: flow-dashboard}
  template:
    metadata:
      labels: {app: flow-dashboard}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: dashboard
          image: python:3.12-slim-bookworm
          command: [python, /app/backend.py]
          env:
            - {name: BIND_ADDRESS, value: 0.0.0.0}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: OTEL_ENDPOINT, value: "http://flow-collector:4318/v1/traces"}
            - {name: AGENT_A2A_URL, value: "http://otel-flow-reader.kagent.svc.cluster.local:8080/"}
            - {name: KAGENT_USER_ID, value: "admin@kagent.dev"}
          ports:
            - {name: http, containerPort: 8787}
          readinessProbe:
            httpGet: {path: /healthz, port: 8787}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 500m, memory: 192Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: app, mountPath: /app, readOnly: true}
            - {name: ui, mountPath: /app/ui, readOnly: true}
      volumes:
        - name: app
          configMap: {name: flow-app}
        - name: ui
          configMap: {name: flow-ui}
---
apiVersion: v1
kind: Service
metadata:
  name: flow-dashboard
  namespace: otel-agent-flow
spec:
  selector: {app: flow-dashboard}
  ports:
    - {name: http, port: 8787, targetPort: 8787}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: flow-gateway-telemetry
  namespace: otel-agent-flow
spec:
  from:
    - {group: agentgateway.dev, kind: AgentgatewayPolicy, namespace: agentgateway-system}
  to:
    - {group: "", kind: Service, name: flow-collector}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: otel-flow-telemetry
  namespace: agentgateway-system
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: Gateway, name: kimi-lab-gateway}
  frontend:
    accessLog:
      otlp:
        backendRef:
          name: flow-collector
          namespace: otel-agent-flow
          port: 4317
        protocol: GRPC
    tracing:
      backendRef:
        name: flow-collector
        namespace: otel-agent-flow
        port: 4317
      protocol: GRPC
      randomSampling: "true"
      clientSampling: "true"
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: otel-flow-reader
  namespace: kagent
spec:
  description: Read-only OTel workflow visualization canary.
  type: Declarative
  declarative:
    runtime: python
    modelConfig: kimi-gateway
    systemMessage: |
      You inspect only the synthetic demo inventory workload.
      Call get_demo_inventory_status once for current status.
      Summarize only the observed result in one sentence.
      You have no write tools. Do not invent dependencies or runtime facts.
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: demo-k8s-evidence
          toolNames: [get_demo_inventory_status]
    deployment:
      volumes:
        - name: tracing-bootstrap
          configMap: {name: otel-flow-tracing-bootstrap}
      volumeMounts:
        - {name: tracing-bootstrap, mountPath: /otel-bootstrap, readOnly: true}
      env:
        - {name: PYTHONPATH, value: /otel-bootstrap}
        - {name: FLOW_TRACING_ENABLED, value: "true"}
        - {name: OTEL_TRACING_ENABLED, value: "true"}
        - {name: OTEL_LOGGING_ENABLED, value: "true"}
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://flow-collector.otel-agent-flow.svc.cluster.local:4317"}
        - {name: OTEL_EXPORTER_OTLP_TRACES_INSECURE, value: "true"}
        - {name: OTEL_EXPORTER_OTLP_LOGS_INSECURE, value: "true"}
        - {name: OTEL_BSP_SCHEDULE_DELAY, value: "200"}
        - {name: TRACELOOP_TRACE_CONTENT, value: "false"}
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-flow-tracing-bootstrap
  namespace: kagent
data:
  sitecustomize.py: |
    import os
    if os.environ.get("FLOW_TRACING_ENABLED") == "true":
        os.environ["OTEL_TRACING_ENABLED"] = "true"
        os.environ["OTEL_LOGGING_ENABLED"] = "true"
